<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Navipedia — IDMS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-0: #0a1628;
    --bg-1: #0f1e38;
    --bg-2: #162440;
    --bg-3: #1e2f4d;
    --bg-input: #0f1e38;
    --accent: #00c2ff;
    --accent-dim: #0090c0;
    --accent-glow: rgba(0, 194, 255, 0.15);
    --danger: #ff4d4d;
    --warning: #ffaa00;
    --success: #00ff99;
    --text-primary: #e8f0fe;
    --text-secondary: #7a90b0;
    --text-muted: #4a5c78;
    --border: rgba(255,255,255,0.08);
    --border-md: rgba(255,255,255,0.16);
    --border-accent: rgba(0, 194, 255, 0.3);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --font: 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Consolas, 'Courier New', monospace;
  }

  html, body { height: 100%; background: var(--bg-0); color: var(--text-primary); font-family: var(--font); font-size: 15px; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button { font-family: inherit; }
  code { font-family: var(--mono); font-size: 0.9em; background: var(--bg-3); padding: 0 4px; border-radius: 4px; }

  .screen { display: none; min-height: 100%; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── Sign-in ─────────────────────────────────────────────── */
  .center-card { margin: auto; width: min(360px, 92vw); background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px 28px; text-align: center; }
  .center-card h1 { font-size: 22px; margin-bottom: 6px; }
  .center-card .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
  .btn { display: inline-block; width: 100%; padding: 12px 16px; border: none; border-radius: var(--radius-md); background: var(--accent); color: #04263a; font-weight: 600; font-size: 15px; cursor: pointer; }
  .btn.ghost { background: var(--bg-3); color: var(--text-primary); margin-top: 10px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* ── The bar ─────────────────────────────────────────────── */
  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 10px 10px; background: var(--bg-1); border-bottom: 1px solid var(--border); }
  .bar-back { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; color: var(--accent); font-size: 26px; line-height: 1; cursor: pointer; }
  .bar-back[hidden] { display: none; }
  .bar-titles { flex: 1; min-width: 0; }
  .bar-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-sub { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-btn { flex: none; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); padding: 7px 10px; font-size: 13px; cursor: pointer; }
  #reauth-bar { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,170,0,.10); border-bottom: 1px solid rgba(255,170,0,.35); font-size: 12.5px; color: var(--text-secondary); }
  #reauth-bar .btn { width: auto; padding: 7px 12px; font-size: 13px; flex: none; }

  .body { flex: 1; padding: 12px 12px calc(40px + env(safe-area-inset-bottom)); max-width: 900px; width: 100%; margin: 0 auto; }
  .loading { padding: 40px 10px; text-align: center; color: var(--text-secondary); font-size: 14px; }
  .empty { padding: 18px 6px; color: var(--text-secondary); font-size: 14px; line-height: 1.5; }
  .note-box { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 10px 0; }
  .warn-box { background: rgba(255,170,0,.08); border: 1px solid rgba(255,170,0,.35); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; line-height: 1.5; margin: 10px 0; }
  .dim { color: var(--text-secondary); }
  .small { font-size: 12px; }

  /* ── Home ────────────────────────────────────────────────── */
  .group-head { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 18px 4px 8px; }
  .group-head:first-child { margin-top: 6px; }
  .tile { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 8px; border-radius: var(--radius-md);
    background: var(--bg-2); border: 1px solid var(--border); color: var(--text-primary); text-align: left; cursor: pointer; }
  .tile:active { background: var(--bg-3); }
  .tile-ico { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-glow); color: var(--accent); font-size: 18px; }
  .tile-main { flex: 1; min-width: 0; }
  .tile-name { display: block; font-size: 15.5px; font-weight: 600; }
  .tile-desc { display: block; font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }
  .tile-chev { color: var(--text-muted); font-size: 20px; }
  .pub { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin: 18px 4px 0; }
  .pub.stale { color: var(--warning); }

  /* ── Lists ───────────────────────────────────────────────── */
  .search { position: sticky; top: calc(59px + env(safe-area-inset-top)); z-index: 10; background: var(--bg-0); padding: 2px 0 8px; }
  .search input { width: 100%; padding: 11px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 16px; font-family: var(--font); }
  .search input:focus { outline: none; border-color: var(--border-accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; }
  .chip-btn { padding: 6px 11px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-secondary); font-size: 12.5px; cursor: pointer; }
  .chip-btn.on { background: var(--accent-glow); border-color: var(--border-accent); color: var(--accent); }
  .chip-btn span { color: var(--text-muted); margin-left: 3px; }
  .count { font-size: 12px; color: var(--text-muted); margin: 2px 4px 6px; }
  .list-group { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); padding: 14px 4px 6px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 9px 10px; border: none; border-bottom: 1px solid var(--border);
    background: transparent; color: var(--text-primary); text-align: left; cursor: pointer; font-size: 14.5px; }
  .row:active { background: var(--bg-2); }
  .row-id { flex: none; font-family: var(--mono); font-size: 12.5px; color: var(--accent); min-width: 64px; }
  .row-main { flex: 1; min-width: 0; line-height: 1.35; }
  .row-sub { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .row .tag { flex: none; }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-md); color: var(--text-secondary); white-space: nowrap; }
  .tag.ok { border-color: rgba(0,255,153,.35); color: var(--success); }
  .tag.warn { border-color: rgba(255,170,0,.45); color: var(--warning); }
  .tag.dash { border-style: dashed; }
  .tag.accent { border-color: var(--border-accent); color: var(--accent); }
  .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: transparent; border: 1px solid var(--border-md); }
  .dot.current { background: var(--success); border-color: var(--success); }
  .dot.behind { background: var(--warning); border-color: var(--warning); }
  .dot.note { background: var(--accent); border-color: var(--accent); }
  .dot.under { border-color: var(--accent); }
  mark { background: rgba(0,194,255,.28); color: inherit; border-radius: 2px; }

  /* ── A page ──────────────────────────────────────────────── */
  .head { margin: 4px 2px 10px; }
  .kicker { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); }
  .title { font-size: 20px; font-weight: 700; line-height: 1.25; margin-top: 2px; }
  .title .tid { font-family: var(--mono); color: var(--accent); font-size: 15px; font-weight: 600; margin-right: 6px; }
  .title .soft { color: var(--text-secondary); font-weight: 500; }
  .meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
  .path { font-size: 11px; color: var(--text-muted); margin-top: 3px; word-break: break-word; }
  .seg { display: flex; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 3px; margin: 8px 0; overflow-x: auto; }
  .seg button { flex: 1 0 auto; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--bg-3); color: var(--text-primary); font-weight: 600; }

  .banner { border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; line-height: 1.5; margin: 8px 0; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-secondary); }
  .banner ul { margin: 6px 0 6px 18px; }
  .banner.behind { background: rgba(255,170,0,.08); border-color: rgba(255,170,0,.35); color: var(--text-primary); }
  .banner.generated { border-color: var(--border-accent); }

  /* The note, as read */
  .md { font-size: 15px; line-height: 1.6; color: var(--text-primary); word-wrap: break-word; }
  .md p { margin: 0 0 10px; }
  .md .h { margin: 18px 0 8px; line-height: 1.3; }
  .md h2.h { font-size: 19px; } .md h3.h { font-size: 17px; } .md h4.h, .md h5.h, .md h6.h { font-size: 15px; }
  .md ul.list, .md ol.list { margin: 0 0 10px 22px; }
  .md li { margin: 3px 0; }
  .md hr { border: none; border-top: 1px solid var(--border-md); margin: 14px 0; }
  .md pre { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; margin: 0 0 10px; white-space: pre; }
  .md .table-wrap { overflow-x: auto; margin: 0 0 12px; -webkit-overflow-scrolling: touch; }
  .md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .md th, .md td { border: 1px solid var(--border-md); padding: 6px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--bg-2); font-weight: 600; }
  .md .callout { border-left: 3px solid var(--accent); background: var(--bg-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 8px 12px; margin: 0 0 12px; }
  .md .callout-warning, .md .callout-caution, .md .callout-danger { border-left-color: var(--warning); }
  .md .callout-title { font-weight: 600; margin-bottom: 4px; }
  .md .callout p:last-child { margin-bottom: 0; }
  .md .embed { border: 1px solid var(--border-accent); border-radius: var(--radius-md); margin: 0 0 12px; overflow: hidden; }
  .md .embed-src { font-size: 12px; color: var(--text-secondary); background: var(--bg-2); padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .md .embed-body { padding: 10px 12px 2px; }
  .md .embed-broken { border-color: rgba(255,77,77,.5); padding: 8px 10px; font-size: 13px; color: var(--text-secondary); }
  .lnk { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(0,194,255,.4); text-underline-offset: 2px; cursor: pointer; background: none; border: none; font: inherit; padding: 0; text-align: left; }
  .lnk.ambiguous { text-decoration-style: dotted; }
  .lnk.far { color: var(--text-primary); text-decoration-style: dashed; }
  .dangling { border-bottom: 1px dashed var(--text-muted); color: var(--text-secondary); }
  .extlink { border-bottom: 1px dotted var(--text-muted); }
  .steps { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px 10px 30px; margin: 0 0 14px; }
  .steps-head { margin-left: -18px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-bottom: 4px; }

  /* The paper — cards, JSAs and the diagnostics report, as they print */
  .paper-wrap { background: #fff; border-radius: var(--radius-md); overflow: hidden; margin: 10px 0; }
  .paper { display: block; width: 100%; border: 0; min-height: 200px; background: #fff; }
  .usedby { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; font-size: 12.5px; }
  .usedby .lbl { color: var(--text-secondary); margin-right: 2px; }
  .pill { padding: 4px 9px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); color: var(--accent); font-family: var(--mono); font-size: 12px; cursor: pointer; }

  /* ── Electrical ──────────────────────────────────────────── */
  .sec { margin: 16px 0; }
  .sec > h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
  .sec > h3 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-muted); }
  .caveat { margin: 16px 0; padding: 10px 12px; border-radius: var(--radius-md); background: rgba(255,170,0,.08); border: 1px solid rgba(255,170,0,.35); font-size: 12.5px; line-height: 1.5; }
  .facts { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 8px; }
  .facts th { text-align: left; font-weight: 500; color: var(--text-secondary); padding: 5px 8px 5px 0; width: 38%; vertical-align: top; }
  .facts td { padding: 5px 0; vertical-align: top; }
  .figs { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0; }
  .fig { margin: 0; }
  .fig figcaption { font-size: 11px; color: var(--text-secondary); margin-top: 2px; max-width: 220px; }
  .fig svg text { font-size: 10px; fill: var(--text-secondary); font-family: inherit; }
  .deck rect { fill: var(--bg-2); stroke: var(--border-md); }
  .deck-on rect { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); }
  .fig svg .deck-on text { fill: var(--text-primary); font-weight: 600; }
  .room { fill: var(--bg-2); stroke: var(--border-md); }
  .fig svg .room-name { font-size: 10px; }
  .fig svg .axis { font-size: 8.5px; letter-spacing: .08em; }
  .rdot { fill: var(--accent); stroke: var(--bg-1); stroke-width: 2; }
  .band { fill: var(--accent); fill-opacity: .3; }
  .drawing-cap { font-size: 12px; color: var(--text-secondary); margin: 10px 0 4px; line-height: 1.45; }
  .drawing { position: relative; width: 100%; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .drawing img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .drawing img[hidden] { display: none; }
  .drawing-wait { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: #666; }
  .marker { position: absolute; transform: translate(-7px, -7px); display: flex; align-items: center; gap: 3px; background: none; border: none; padding: 0; cursor: pointer; }
  .marker-dot { width: 14px; height: 14px; border-radius: 50%; background: #0a84c6; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); flex: none; }
  .marker-label { font-size: 9.5px; font-weight: 600; color: #0b2d40; background: rgba(255,255,255,.9); border: 1px solid rgba(10,132,198,.6); border-radius: 3px; padding: 0 3px; white-space: nowrap; }
  .marker-on .marker-dot { background: #e0443a; animation: pulse 1.6s ease-out infinite; }
  .marker-on .marker-label { border-color: #e0443a; color: #5a0f0a; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(224,68,58,.65); } 100% { box-shadow: 0 0 0 16px rgba(224,68,58,0); } }
  @media (prefers-reduced-motion: reduce) { .marker-on .marker-dot { animation: none; } }
  .tree { list-style: none; padding-left: 14px; border-left: 1px solid var(--border-md); margin: 2px 0 2px 2px; }
  .tree li { padding: 4px 0; font-size: 13.5px; line-height: 1.5; }
  .arrow { color: var(--text-muted); }
  .brtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .brtable th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--text-secondary); border-bottom: 1px solid var(--border-md); padding: 5px 6px; }
  .brtable td { padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .brtable .num { width: 40px; text-align: right; font-family: var(--mono); }
  .brtable tr.empty td { color: var(--text-muted); }
  .ecard { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; }
  .ecard-head { margin-bottom: 4px; }
  .serves-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; padding: 5px 0; font-size: 13.5px; }
  .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--bg-3); color: var(--text-secondary); }
  .kind.panel { color: var(--accent); } .kind.breaker { color: var(--warning); } .kind.item { color: var(--success); }
  .ladder-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ladder-deck { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .ladder-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill.dash { border-style: dashed; }
  details.chain { margin-top: 6px; font-size: 13px; }
  details.chain summary { color: var(--text-secondary); cursor: pointer; }
  .diag li { margin: 6px 0 6px 18px; font-size: 13.5px; line-height: 1.5; }

  /* ── Diagnostics ─────────────────────────────────────────── */
  .node { display: flex; align-items: center; gap: 6px; min-height: 42px; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }
  .node.retired { opacity: .55; }
  .node.hist .node-code { color: var(--warning); }
  .twisty { flex: none; width: 30px; height: 30px; border: none; background: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: transform .12s; }
  .twisty.open { transform: rotate(90deg); }
  .twisty-sp { flex: none; width: 30px; }
  .node-code { flex: none; font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .node-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-secondary); padding: 4px 2px 8px; }
  .check input { width: 18px; height: 18px; }
  .field-row { display: flex; gap: 8px; margin: 6px 0; }
  .field-row input { flex: 1; min-width: 0; padding: 10px 11px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 16px; font-family: var(--font); }
  .field-row button { flex: none; padding: 0 14px; border-radius: var(--radius-md); border: 1px solid var(--border-accent); background: var(--accent-glow); color: var(--accent); font-size: 14px; cursor: pointer; }
  .field-lbl { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--bg-3); border: 1px solid var(--border-md); color: var(--text-primary);
    padding: 10px 14px; border-radius: var(--radius-md); font-size: 13.5px; max-width: 90vw; box-shadow: 0 6px 24px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>

<!-- ── Microsoft sign-in (only when this browser has no session) ── -->
<div class="screen active" id="screen-auth">
  <div class="center-card">
    <h1>Navipedia</h1>
    <div class="sub">The vessel's orientation, cards and references — read-only on the phone.</div>
    <button class="btn" id="btn-msauth" onclick="nvMsSignIn()">Sign in with Microsoft</button>
    <div class="err" id="auth-err"></div>
    <button class="btn ghost" onclick="location.href='index.html'">Back to IDMS</button>
  </div>
</div>

<!-- ── No IDMS session in this browser ─────────────────────── -->
<div class="screen" id="screen-noidms">
  <div class="center-card">
    <h1>Sign in to IDMS first</h1>
    <div class="sub">Navipedia opens from the department screen once you are signed in to IDMS on this phone.</div>
    <button class="btn" onclick="location.href='index.html'">Open IDMS</button>
  </div>
</div>

<!-- ── App ─────────────────────────────────────────────────── -->
<div class="screen" id="screen-app">
  <div class="bar">
    <button class="bar-back" id="bar-back" aria-label="Back" onclick="nvBack()">‹</button>
    <div class="bar-titles">
      <div class="bar-title" id="bar-title">Navipedia</div>
      <div class="bar-sub" id="bar-sub"></div>
    </div>
    <button class="bar-btn" id="bar-home" onclick="nvHomeOrIdms()">IDMS</button>
  </div>
  <div id="reauth-bar">
    <span style="flex:1"><b>Microsoft sign-in has expired.</b> What is already on this phone stays readable.</span>
    <button class="btn" onclick="nvReconnect()">Sign in again</button>
  </div>
  <div class="body" id="body"></div>
</div>

<div id="toast"></div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<!-- The Console's own pure modules, mirrored byte-identical (tools/test/
     console-derive.test.js): the same code turns the same data into the same
     page on both doors. -->

<script>
// ════════════════════════════════════════════════════════════
// IDMS Navipedia — standalone page, read-only.
//
// The Console's Navipedia (IDMS-Console/docs/navipedia*.md) reads the vault on
// the ship's server. A phone cannot reach that share, so the Console publishes
// what its screens read to OneDrive, and this page reads it:
//
//   Documents/IDMS/data/navipedia/
//     manifest.json            what was published, when, by whom; a
//                              fingerprint per file
//     range.json               the 0.8 Navipedia range, its links and embeds
//     range-lane.json          the lane notes the range links to (one hop)
//     cards.json               the SOP / Job / KSA card corpus
//     jsa.json                 the JSAs
//     electrical.json          the panel mirror, spaces, deck canvases
//     electrical-images.json   the deck drawings
//     diagnostics.json         failure history, register, TM critical flags
//     diagnostics-jobs.json    the job-history mirror
//     letterhead.json          Report Setup's letterhead and the vessel name
//
// IDMS-Console/docs/navipedia-mobile.md is the contract. Each file is fetched
// the first time its section is opened and kept on the phone (IndexedDB), and
// fetched again only when the manifest's fingerprint for it changes — so a
// phone that has opened a section once can read it offline.
//
// Parity with the Console, less authoring: nothing here writes anything, to the
// vault or to OneDrive. The Console's Edit, Mark reviewed, New map, New JSA,
// Sign, Upkeep, Print, Save PDF and Open in Obsidian have no button here.
// ════════════════════════════════════════════════════════════

var ONEDRIVE_BASE = 'Documents/IDMS';
var NV_DIR = ONEDRIVE_BASE + '/data/navipedia';
// The bundle schema this page reads (navipedia-mobile.js BUNDLE_VERSION).
var NV_BUNDLE_VERSION = 1;
// A copy older than this is said to be old, loudly.
var NV_STALE_DAYS = 3;

var MSAL_CONFIG = {
  auth: {
    clientId:    '5f7c6099-c379-4cfa-ab6a-92bf33b812aa',
    authority:   'https://login.microsoftonline.com/816c3d02-39d9-4940-9b6f-08b4cf0321ce',
    redirectUri: 'https://ara-chief.github.io/IDMS/'
  },
  cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
};
var MSAL_SCOPES = ['User.Read', 'Files.ReadWrite', 'offline_access'];

var NV = {
  msal: null, account: null, user: null,
  manifest: null, manifestFrom: '',   // 'network' | 'phone'
  files: {},                          // name -> parsed file (memory)
  loading: {},                        // name -> Promise
  stack: [],                          // the views, newest last
  // Per-section state that outlives a view
  pagesFilter: '',
  cardQuery: { sops: '', jobs: '', ksas: '' }, ksaFilter: 'all', cardFormat: 'sheet',
  jsaQuery: '', jsaFilter: 'all',
  elecQuery: '',
  diag: { q: '', only: false, expanded: {}, tier: 'tech', techFilter: '', sweepQ: '' },
  // Derived indexes, built once per file
  ix: {}
};

// ── Small things ────────────────────────────────────────────

function nvEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nvShow(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('active', s.id === id); });
}
var nvToastTimer = null;
function nvToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(nvToastTimer);
  nvToastTimer = setTimeout(function () { t.classList.remove('on'); }, 3200);
}
function nvAgo(iso) {
  var t = Date.parse(iso);
  if (!isFinite(t)) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60);
  if (h < 36) return h + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
// FNV-1a, as the Console's publish keys each step block
// (navipedia-mobile-publish.js npmFingerprint). Change both or neither.
function nvFingerprint(text) {
  var h = 0x811c9dc5;
  for (var i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8) + '-' + text.length.toString(36);
}
function nvHighlight(text, query) {
  var terms = String(query || '').trim().toLowerCase().split(/\s+/)
    .filter(function (t) { return t.length > 1 && ['or', 'and', 'not'].indexOf(t) === -1 && t.charAt(0) !== '-'; });
  var out = nvEsc(text);
  terms.forEach(function (t) {
    var re = new RegExp('(' + nvEsc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    out = out.replace(/(^|>)([^<]*)/g, function (m, lead, seg) { return lead + seg.replace(re, '<mark>$1</mark>'); });
  });
  return out;
}

// ── Microsoft sign-in (notes.html's, verbatim in shape) ─────

function nvNeedsInteraction(e) {
  if (!e) return false;
  var code = e.errorCode || '';
  return e.name === 'InteractionRequiredAuthError' ||
         code === 'interaction_required' || code === 'login_required' ||
         code === 'consent_required'     || code === 'no_account_error' ||
         code === 'monitor_window_timeout';
}
async function nvToken(force) {
  try {
    var res = await NV.msal.acquireTokenSilent({ scopes: MSAL_SCOPES, account: NV.account, forceRefresh: !!force });
    document.getElementById('reauth-bar').style.display = 'none';
    return res.accessToken;
  } catch (e) {
    if (nvNeedsInteraction(e)) {
      document.getElementById('reauth-bar').style.display = 'flex';
      var err = new Error('Microsoft sign-in has expired');
      err.nvReauth = true;
      throw err;
    }
    throw e;
  }
}
async function nvReconnect() {
  try {
    var res = await NV.msal.acquireTokenPopup({ scopes: MSAL_SCOPES, account: NV.account });
    if (res && res.account) NV.account = res.account;
    document.getElementById('reauth-bar').style.display = 'none';
    await nvLoadManifest();
    nvRender();
  } catch (e) { nvToast('Could not sign in — ' + (e && e.message ? e.message : e)); }
}
function nvGraphUrl(path) {
  return 'https://graph.microsoft.com/v1.0/me/drive/root:/' + encodeURIComponent(path).replace(/%2F/g, '/') + ':/content';
}
async function nvFetch(url) {
  var resp = await fetch(url, { headers: { Authorization: 'Bearer ' + await nvToken(false) }, cache: 'no-store' });
  if (resp.status === 401) resp = await fetch(url, { headers: { Authorization: 'Bearer ' + await nvToken(true) }, cache: 'no-store' });
  return resp;
}
function nvInit() {
  try {
    NV.msal = new msal.PublicClientApplication(MSAL_CONFIG);
    NV.msal.handleRedirectPromise().then(function () {
      var accounts = NV.msal.getAllAccounts();
      if (accounts.length > 0) { NV.account = accounts[0]; nvAfterMsAuth(); }
    }).catch(function (e) { nvAuthError(e); });
  } catch (e) { nvAuthError(e); }
}
function nvAuthError(e) {
  document.getElementById('auth-err').textContent = 'Sign-in problem: ' + (e && e.message ? e.message : e);
}
function nvMsSignIn() {
  document.getElementById('auth-err').textContent = '';
  NV.msal.loginPopup({ scopes: MSAL_SCOPES })
    .then(function (r) { NV.account = r.account; nvAfterMsAuth(); })
    .catch(function (e) { nvAuthError(e); });
}
// The IDMS session this browser already holds (notes.html ntSavedIdmsUser).
function nvSavedIdmsUser() {
  try {
    var s = JSON.parse(localStorage.getItem('fw_session') || 'null');
    if (s && s.user && s.user.username) return s.user;
  } catch (e) {}
  try {
    var u = JSON.parse(localStorage.getItem('fw_user') || 'null');
    if (u && u.username) return u;
  } catch (e) {}
  return null;
}
async function nvAfterMsAuth() {
  NV.user = nvSavedIdmsUser();
  if (!NV.user) { nvShow('screen-noidms'); return; }
  nvShow('screen-app');
  document.getElementById('body').innerHTML = '<div class="loading">Checking for the latest Navipedia…</div>';
  await nvLoadManifest();
  // A deep link opens on top of Home, so Back lands there rather than
  // leaving the page.
  var start = nvViewFromHash();
  NV.stack = [{ v: 'home' }];
  history.replaceState({ depth: 1 }, '', location.pathname + location.search);
  if (start) {
    NV.stack.push(start);
    history.pushState({ depth: 2 }, '', nvHashFor(start));
  }
  nvRender();
}

// ── The phone's copy: IndexedDB, one row per published file ─

var nvDbP = null;
function nvDb() {
  if (nvDbP) return nvDbP;
  nvDbP = new Promise(function (resolve) {
    try {
      var req = indexedDB.open('idms-navipedia', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
  return nvDbP;
}
async function nvDbGet(key) {
  var db = await nvDb();
  if (!db) return null;
  return new Promise(function (resolve) {
    try {
      var r = db.transaction('files').objectStore('files').get(key);
      r.onsuccess = function () { resolve(r.result || null); };
      r.onerror = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
}
async function nvDbPut(key, val) {
  var db = await nvDb();
  if (!db) return;
  return new Promise(function (resolve) {
    try {
      var tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put(val, key);
      tx.oncomplete = tx.onerror = function () { resolve(); };
    } catch (e) { resolve(); }
  });
}

// The manifest is read from OneDrive every time the page opens — it is small,
// and it is how the phone learns anything changed. Offline, the last one this
// phone read stands, and the bar says so.
async function nvLoadManifest() {
  try {
    var resp = await nvFetch(nvGraphUrl(NV_DIR + '/manifest.json'));
    if (resp.status === 404) { NV.manifest = null; NV.manifestFrom = 'none'; return; }
    if (!resp.ok) throw new Error('manifest ' + resp.status);
    var text = await resp.text();
    NV.manifest = JSON.parse(text);
    NV.manifestFrom = 'network';
    nvDbPut('manifest.json', { text: text });
  } catch (e) {
    var had = await nvDbGet('manifest.json');
    try { NV.manifest = had ? JSON.parse(had.text) : null; } catch (x) { NV.manifest = null; }
    NV.manifestFrom = NV.manifest ? 'phone' : 'none';
  }
}

// One published file, parsed. From memory, else from the phone when its
// fingerprint matches the manifest, else from OneDrive.
function nvFile(name) {
  if (NV.files[name]) return Promise.resolve(NV.files[name]);
  if (NV.loading[name]) return NV.loading[name];
  var want = NV.manifest && NV.manifest.files && NV.manifest.files[name];
  var p = (async function () {
    var had = await nvDbGet(name);
    var text = null;
    if (had && want && had.fp === want.fp) text = had.text;
    if (text == null) {
      try {
        var resp = await nvFetch(nvGraphUrl(NV_DIR + '/' + name));
        if (!resp.ok) throw new Error('OneDrive answered ' + resp.status);
        text = await resp.text();
        nvDbPut(name, { fp: want ? want.fp : '', text: text });
      } catch (e) {
        // Offline with an older copy: better than nothing, and the bar says
        // how old the manifest it came with is.
        if (had) text = had.text;
        else throw e;
      }
    }
    var obj = JSON.parse(text);
    NV.files[name] = obj;
    return obj;
  })();
  NV.loading[name] = p;
  p.catch(function () {}).then(function () { delete NV.loading[name]; });
  return p;
}

// ── Views and the back button ───────────────────────────────
//
// A stack of plain objects. The phone's own back gesture pops it, the same as
// the ‹ in the bar.

function nvGo(view) {
  NV.stack.push(view);
  history.pushState({ depth: NV.stack.length }, '', nvHashFor(view));
  window.scrollTo(0, 0);
  nvRender();
}
function nvReplace(view) {
  NV.stack[NV.stack.length - 1] = view;
  history.replaceState({ depth: NV.stack.length }, '', nvHashFor(view));
  nvRender();
}
function nvBack() {
  if (NV.stack.length > 1) history.back();
  else location.href = 'index.html';
}
// The history entry says how deep it was, so a jump of several entries (Home)
// and a single Back both land on the right view.
window.addEventListener('popstate', function (e) {
  var depth = (e.state && e.state.depth) || 1;
  if (depth < NV.stack.length) NV.stack = NV.stack.slice(0, Math.max(1, depth));
  window.scrollTo(0, 0);
  nvRender();
});
function nvHomeOrIdms() {
  if (NV.stack.length > 1) {
    var n = NV.stack.length - 1;
    NV.stack = [{ v: 'home' }];
    history.go(-n);
  } else {
    location.href = 'index.html';
  }
}
// A deep link survives a reload: #card=SOP-0021, #elec=LP3 23, #diag=331.001.
function nvHashFor(v) {
  if (v.v === 'card') return '#card=' + encodeURIComponent(v.id);
  if (v.v === 'note') return '#note=' + encodeURIComponent(v.rel);
  if (v.v === 'jsa')  return '#jsa=' + encodeURIComponent(v.id);
  if (v.v === 'diagm') return '#diag=' + encodeURIComponent(v.code);
  return location.pathname + location.search;
}
function nvViewFromHash() {
  var m = location.hash.match(/^#(card|note|jsa|diag)=(.+)$/);
  if (!m) return null;
  var val = decodeURIComponent(m[2]);
  if (m[1] === 'card') return { v: 'card', id: val };
  if (m[1] === 'note') return { v: 'note', rel: val };
  if (m[1] === 'jsa')  return { v: 'jsa', id: val };
  if (m[1] === 'diag') return { v: 'diagm', code: val };
  return null;
}

function nvSetBar(title, sub) {
  document.getElementById('bar-title').textContent = title || 'Navipedia';
  document.getElementById('bar-sub').textContent = sub || '';
  document.getElementById('bar-home').textContent = NV.stack.length > 2 ? 'Home' : 'IDMS';
}

var nvRenderSeq = 0;
async function nvRender() {
  var seq = ++nvRenderSeq;
  var view = NV.stack[NV.stack.length - 1] || { v: 'home' };
  var body = document.getElementById('body');
  var R = NV_VIEWS[view.v] || NV_VIEWS.home;
  nvSetBar(R.title(view), '');
  if (R.needs && R.needs.length) {
    var missing = R.needs.filter(function (n) { return !NV.files[n]; });
    if (missing.length) {
      body.innerHTML = '<div class="loading">' + nvEsc(R.loadingText || 'Reading…') + '</div>';
      try { await Promise.all(missing.map(nvFile)); }
      catch (e) {
        if (seq !== nvRenderSeq) return;
        body.innerHTML = nvNotAvailable(missing, e);
        return;
      }
      if (seq !== nvRenderSeq) return;
    }
  }
  try { R.render(view, body); }
  catch (e) {
    console.error(e);
    body.innerHTML = '<div class="warn-box">This page could not be drawn: ' + nvEsc(e && e.message ? e.message : e) + '</div>';
  }
}

function nvNotAvailable(names, e) {
  if (!NV.manifest) return nvNeverPublishedHtml();
  var why = e && e.nvReauth ? 'Microsoft sign-in has expired — sign in again above.'
          : 'This part has not been downloaded yet, and OneDrive could not be reached (' + nvEsc(e && e.message ? e.message : e) + '). Open it once with a connection and it stays readable offline.';
  return '<div class="warn-box"><b>Not on this phone yet.</b> ' + why + '</div>';
}
function nvNeverPublishedHtml() {
  return '<div class="warn-box"><b>Nothing has been published to phones yet.</b> ' +
    'The Console publishes the Navipedia when anybody opens it there, at most once a day, or on demand from ' +
    'Navipedia → Health → <b>Publish to phones</b>.</div>';
}
// A file the Console could not read when it published says so, instead of
// the page drawing empty.
function nvFileError(name) {
  var f = NV.files[name];
  if (f && f.ok === false) return '<div class="warn-box">The Console could not read this part of the vault when it published: ' + nvEsc(f.error || 'unknown reason') + '</div>';
  return '';
}

// ════════════════════════════════════════════════════════════
// Home
// ════════════════════════════════════════════════════════════

var NV_SECTIONS = [
  ['Orientation', [
    ['starthere', '⌂', 'Start Here', 'The front door to the vessel'],
    ['ship',      '⛴', 'The Ship', 'The deck maps'],
    ['systems',   '⚙', 'Systems', 'The Systems Index and its hubs'],
    ['pages',     '☰', 'All pages', 'Every map, trail and view in the range'],
    ['health',    '✓', 'Health', 'Which maps are behind their sources']
  ]],
  ['Cards', [
    ['sops', '§', 'SOPs', 'Procedures and global tasks'],
    ['jobs', '⚒', 'Jobs', 'Job cards and job wrappers'],
    ['ksas', '◈', 'KSAs', 'Knowledge and skills']
  ]],
  ['Safety and systems', [
    ['jsa',  '⚠', 'JSA', 'Job safety analyses, by machine'],
    ['elec', '⚡', 'Electrical Distribution', 'What feeds a breaker, a panel or a machine — and where it is'],
    ['diag', '✚', 'Diagnostics', 'What the record says about how a machine fails']
  ]]
];
// The range's entries land on one note each, by name (NPD_SECTIONS).
var NV_RANGE_ENTRY = { starthere: 'Start Here', ship: 'Below Main Deck', systems: 'Systems Index' };

function nvOpenSection(key) {
  if (NV_RANGE_ENTRY[key]) { nvGo({ v: 'note', entry: key }); return; }
  if (key === 'pages')  { nvGo({ v: 'pages' }); return; }
  if (key === 'health') { nvGo({ v: 'health' }); return; }
  if (key === 'sops' || key === 'jobs' || key === 'ksas') { nvGo({ v: 'cards', section: key }); return; }
  if (key === 'jsa')  { nvGo({ v: 'jsas' }); return; }
  if (key === 'elec') { nvGo({ v: 'elec', ev: { kind: 'home' } }); return; }
  if (key === 'diag') { nvGo({ v: 'diag' }); return; }
}

function nvPublishedLine() {
  var m = NV.manifest;
  if (!m) return '';
  var age = (Date.now() - Date.parse(m.published)) / 86400000;
  var when = new Date(m.published).toLocaleString();
  var src = NV.manifestFrom === 'phone' ? ' OneDrive could not be reached — this is the copy already on the phone.' : '';
  return '<div class="pub' + (age > NV_STALE_DAYS ? ' stale' : '') + '">Published from the Console ' + nvEsc(nvAgo(m.published)) +
    ' (' + nvEsc(when) + (m.by ? ', ' + nvEsc(m.by) : '') + ').' +
    (age > NV_STALE_DAYS ? ' <b>That is more than ' + NV_STALE_DAYS + ' days old</b> — the vault may have moved on since.' : '') + src +
    '<br>Read-only here. Edits, sign-offs and printing are done on the Console.</div>';
}

var NV_VIEWS = {};

NV_VIEWS.home = {
  title: function () { return 'Navipedia'; },
  render: function (view, body) {
    if (NV.manifest && Number(NV.manifest.version) > NV_BUNDLE_VERSION) {
      body.innerHTML = '<div class="warn-box">The Console published a newer Navipedia than this page can read. Reload the app to update it.</div>';
      return;
    }
    var html = NV.manifest ? '' : nvNeverPublishedHtml();
    NV_SECTIONS.forEach(function (g) {
      html += '<div class="group-head">' + nvEsc(g[0]) + '</div>';
      g[1].forEach(function (s) {
        html += '<button class="tile" data-section="' + s[0] + '"><span class="tile-ico">' + s[1] + '</span>' +
          '<span class="tile-main"><span class="tile-name">' + nvEsc(s[2]) + '</span><span class="tile-desc">' + nvEsc(s[3]) + '</span></span>' +
          '<span class="tile-chev">›</span></button>';
      });
    });
    body.innerHTML = html + nvPublishedLine();
    body.onclick = function (e) {
      var t = e.target.closest('[data-section]');
      if (t) nvOpenSection(t.dataset.section);
    };
    body.oninput = null;
  }
};

// ════════════════════════════════════════════════════════════
// The range — maps, trails, views (Console: navipedia.js)
// ════════════════════════════════════════════════════════════

var NV_KIND_LABEL = { map: 'Map', trail: 'Trail', view: 'View', canvas: 'Canvas', base: 'Base' };
var NV_IMAGE_EXT = /\.(png|jpe?g|gif|webp|svg|bmp)$/i;

function nvRange() { return NV.files['range.json']; }
function nvRangeByRel(rel) {
  var r = nvRange();
  return r && r.notes ? r.notes.filter(function (n) { return n.rel === rel; })[0] || null : null;
}

NV_VIEWS.pages = {
  title: function () { return 'All pages'; },
  needs: ['range.json'],
  loadingText: 'Reading the range…',
  render: function (view, body) {
    var r = nvRange();
    if (r.ok === false) { body.innerHTML = nvFileError('range.json'); return; }
    body.innerHTML = '<div class="search"><input type="search" id="pg-q" placeholder="Filter the range…" value="' + nvEsc(NV.pagesFilter) + '"></div><div id="pg-list"></div>';
    var draw = function () {
      var q = NV.pagesFilter.trim().toLowerCase();
      var shown = r.notes.filter(function (n) {
        if (!q) return true;
        return (n.title + ' ' + n.name + ' ' + n.id + ' ' + n.folder + ' ' + (n.tags || []).join(' ')).toLowerCase().indexOf(q) !== -1;
      });
      var behind = r.notes.filter(function (n) { return n.behind && n.behind.length; }).length;
      var out = '<button class="row" data-health="1"><span class="dot' + (behind ? ' behind' : ' current') + '"></span><span class="row-main">' +
        (behind ? behind + ' map' + (behind === 1 ? '' : 's') + ' behind their sources' : 'Currency — every tracked map is current') + '</span><span class="tile-chev">›</span></button>';
      var folder = null;
      shown.forEach(function (n) {
        if (n.folder !== folder) { folder = n.folder; out += '<div class="list-group">' + nvEsc(folder || 'Range root') + '</div>'; }
        var stale = n.behind && n.behind.length;
        out += '<button class="row" data-rel="' + nvEsc(n.rel) + '"><span class="dot' + (stale ? ' behind' : (n.tracked ? ' current' : '')) + '"></span>' +
          '<span class="row-main">' + nvEsc(n.title) + '</span><span class="tag">' + nvEsc(NV_KIND_LABEL[n.kind] || n.kind) + '</span></button>';
      });
      if (!shown.length) out += '<div class="empty">Nothing in the range matches that.</div>';
      document.getElementById('pg-list').innerHTML = out;
    };
    draw();
    body.oninput = function (e) { if (e.target.id === 'pg-q') { NV.pagesFilter = e.target.value; draw(); } };
    body.onclick = function (e) {
      if (e.target.closest('[data-health]')) { nvGo({ v: 'health' }); return; }
      var row = e.target.closest('[data-rel]');
      if (row) nvGo({ v: 'note', rel: row.dataset.rel });
    };
  }
};

NV_VIEWS.health = {
  title: function () { return 'Health'; },
  needs: ['range.json'],
  loadingText: 'Reading the range…',
  render: function (view, body) {
    var r = nvRange();

    var tracked = r.notes.filter(function (n) { return n.tracked; });
    var behind = tracked.filter(function (n) { return n.behind.length; });
    var untracked = r.notes.filter(function (n) { return (n.kind === 'map' || n.kind === 'trail') && !n.tracked; });
    var report = r.notes.filter(function (n) { return n.name === 'Navipedia Health' && n.ext === '.md'; })[0];
    var html = '<div class="head"><div class="title">Currency</div><div class="meta">' + tracked.length + ' tracked · ' + behind.length +
      ' behind · as of the Console\'s publish, ' + nvEsc(nvAgo(NV.manifest && NV.manifest.published)) + '</div></div>' +
      '<div class="md"><p>A page is tracked when it carries both <code>reviewed:</code> and a <code>covers:</code> list. It is behind when something it covers has moved since. A page with no <code>covers:</code> makes no claim about what it depends on, so nothing can be said about it — that is not a pass, and it is listed below.</p></div>' +
      (report ? '<button class="tile" data-rel="' + nvEsc(report.rel) + '"><span class="tile-ico">✓</span><span class="tile-main"><span class="tile-name">The health report</span><span class="tile-desc">Navipedia Health, as the generator last wrote it</span></span><span class="tile-chev">›</span></button>' : '') +
      '<div class="sec"><h3>Behind their sources</h3>';
    if (behind.length) {
      behind.forEach(function (n) {
        html += '<button class="row" data-rel="' + nvEsc(n.rel) + '"><span class="dot behind"></span><span class="row-main">' + nvEsc(n.title) +
          '<span class="row-sub">Reviewed ' + nvEsc(n.reviewed) + ' · ' + n.behind.map(function (b) { return nvEsc(b.name) + (b.via === 'missing' ? ' (missing)' : ' — ' + nvEsc(b.date)); }).join('; ') + '</span></span></button>';
      });
    } else html += '<div class="empty">Nothing. Every tracked page has been read since its sources last moved.</div>';
    html += '</div><div class="sec"><h3>Not tracked</h3>';
    if (untracked.length) {
      untracked.forEach(function (n) {
        html += '<button class="row" data-rel="' + nvEsc(n.rel) + '"><span class="dot"></span><span class="row-main">' + nvEsc(n.title) +
          '<span class="row-sub">' + nvEsc(n.folder) + ' · ' + (n.reviewed ? 'no covers:' : 'no reviewed:') + '</span></span></button>';
      });
    } else html += '<div class="empty">Every authored page states what it covers and when it was read.</div>';
    html += '</div>';
    body.innerHTML = html;
    body.oninput = null;
    body.onclick = function (e) {
      var row = e.target.closest('[data-rel]');

  }
};

// A range note, or a lane note one hop out of it.
NV_VIEWS.note = {
  title: function (view) {
    var rec = view.rel ? nvRangeByRel(view.rel) : null;
    return rec ? rec.title : (view.entry ? NV_SECTIONS[0][1].filter(function (s) { return s[0] === view.entry; })[0][2] : 'Navipedia');
  },
  needs: ['range.json'],
  loadingText: 'Reading the range…',
  render: function (view, body) {
    var r = nvRange();
    if (r.ok === false) { body.innerHTML = nvFileError('range.json'); return; }
    body.oninput = null;
    body.onclick = nvNoteClick;
    // An entry is a note by name; Markdown wins the name over the canvas.
    if (view.entry && !view.rel) {
      var name = NV_RANGE_ENTRY[view.entry];
      var hit = r.notes.filter(function (n) { return n.name === name && n.ext === '.md'; })[0] ||
                r.notes.filter(function (n) { return n.kind === 'map'; })[0];
      if (!hit) { body.innerHTML = '<div class="empty">The range has no page called “' + nvEsc(name) + '”.</div>'; return; }
      view.rel = hit.rel;
      history.replaceState({ depth: NV.stack.length }, '', nvHashFor(view));
      nvSetBar(hit.title);
    }
    var rec = nvRangeByRel(view.rel);

      return;

    if (!lane) {
      body.innerHTML = '<div class="warn-box">This note is not on the phone. The phone carries the Navipedia range and the notes it links to directly; open <b>' + nvEsc(view.rel) + '</b> on the Console.</div>';
      return;
    }
    nvSetBar(lane.frontmatter && lane.frontmatter.title ? String(lane.frontmatter.title) : lane.name);

function nvRangeNoteHtml(rec) {
  var meta = [NV_KIND_LABEL[rec.kind] || rec.kind];
  if (rec.status)   meta.push('Status: ' + rec.status);
  if (rec.author)   meta.push('Written by ' + rec.author);
  if (rec.revised)  meta.push('Revised ' + rec.revised);
  if (rec.reviewed) meta.push('Reviewed ' + rec.reviewed);
  var banner = '';
  if (rec.kind === 'view') {
    banner = '<div class="banner generated"><b>Generated view.</b> Written by <code>' + nvEsc(rec.generator || 'a generator') +
      '</code> and rewritten in full on every run. Change the cards it reads and rerun the generator.</div>';
  } else if (rec.kind === 'canvas') {
    banner = '<div class="banner">A canvas — the deck drawing with a card on every space. Canvases are drawn in Obsidian and opened there, on the Console.' +
      ' The panels on a deck drawing are under <b>Electrical Distribution</b>.</div>';
  } else if (rec.kind === 'base') {
    banner = '<div class="banner">A Base — a live query over the vault, run by Obsidian\'s Bases plugin, on the Console.</div>';
  } else if (rec.behind && rec.behind.length) {
    banner = '<div class="banner behind"><b>Behind its sources.</b> This page was reviewed ' + nvEsc(rec.reviewed) + '; what it covers has moved since:<ul>' +
      rec.behind.map(function (b) { return '<li>' + nvEsc(b.name) + ' — ' + (b.via === 'missing' ? 'no note of that name in the vault' : nvEsc(b.date) + ' (' + nvEsc(b.via) + ')') + '</li>'; }).join('') +
      '</ul>Until somebody re-reads it on the Console and marks it reviewed, check what it says against those.</div>';
  }
  var head = '<div class="head"><div class="title">' + nvEsc(rec.title) + '</div><div class="meta">' + nvEsc(meta.join('  ·  ')) +
    '</div><div class="path">' + nvEsc(rec.rel) + '</div></div>';
  if (rec.error) return head + banner + '<div class="warn-box">' + nvEsc(rec.error) + '</div>';
  if (rec.kind === 'canvas' || rec.kind === 'base') return head + banner;
  var steps = rec.kind === 'trail' && rec.steps && rec.steps.length ? nvStepsHtml(rec.steps) : '';
  return head + banner + '<div class="md">' + steps + nvMarkdown(rec.body || '', 0) + '</div>';
}

function nvLaneNoteHtml(lane) {
  var fm = lane.frontmatter || {};
  var meta = ['Lane note'];
  if (fm.status)  meta.push('Status: ' + fm.status);
  if (fm.revised) meta.push('Revised ' + fm.revised);
  var title = fm.title ? String(fm.title) : lane.name;
  return '<div class="head"><div class="title">' + nvEsc(title) + '</div><div class="meta">' + nvEsc(meta.join('  ·  ')) +
    '</div><div class="path">' + nvEsc(lane.rel) + '</div></div>' +
    '<div class="banner">A note from outside the Navipedia range, read-only. It belongs to its own lane and is edited there.</div>' +
    '<div class="md">' + nvMarkdown(lane.body || '', 0) + '</div>';

function nvStepsHtml(steps) {

    var hit = links[s];

// A link that goes somewhere. Where it can open on the phone it is a live
// link; a note two hops out says it is read on the Console.
function nvLinkTag(hit, labelHtml, title) {
  var cls = 'lnk' + (hit.ambiguous ? ' ambiguous' : '');
  var tip = hit.rel + (hit.ambiguous ? ' — ' + hit.ambiguous + ' notes share this name' : '');
  if (hit.kind === 'card') return '<a class="' + cls + '" data-card="' + nvEsc(hit.id) + '" title="' + nvEsc(tip) + '">' + labelHtml + '</a>';
  if (hit.kind === 'image' || hit.kind === 'obsidian') return '<a class="' + cls + ' far" data-far="' + nvEsc(hit.rel) + '" title="' + nvEsc(tip) + '">' + labelHtml + '</a>';
  return '<a class="' + cls + '" data-note="' + nvEsc(hit.rel) + '" title="' + nvEsc(tip) + '">' + labelHtml + '</a>';

function nvNoteClick(e) {

// The Console's small block renderer (navipedia.js npdMarkdown), ported: it
// covers what the range's notes use, and anything it does not recognise falls
// through to a paragraph rather than disappearing.
function nvMarkdown(body, depth) {
  var lines = String(body || '').replace(/\r\n/g, '\n').split('\n');
  var out = [];
  var para = [];
  var flush = function () {
    if (!para.length) return;
    out.push('<p>' + nvInline(para.join(' '), depth) + '</p>');
    para = [];
  };
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var t = line.trim();
    var fence = t.match(/^(```+|~~~+)/);
    if (fence) {
      flush();
      var marker = fence[1], buf = [];
      i++;
      for (; i < lines.length; i++) {
        if (lines[i].trim().indexOf(marker) === 0) break;
        buf.push(lines[i]);
      }
      out.push('<pre>' + nvEsc(buf.join('\n')) + '</pre>');
      continue;
    }
    if (!t) { flush(); continue; }
    var embed = t.match(/^!\[\[([^\]]+)\]\]$/);
    if (embed) { flush(); out.push(nvEmbedHtml(embed[1], depth)); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flush(); out.push('<hr>'); continue; }
    var h = t.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flush();
      if (h[1].length === 1 && !out.length && depth === 0) continue;
      var lvl = Math.min(h[1].length + 1, 6);
      out.push('<h' + lvl + ' class="h">' + nvInline(h[2], depth) + '</h' + lvl + '>');
      continue;
    }
    if (t.charAt(0) === '|' && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
      flush();
      var tb = [];
      while (i < lines.length && lines[i].trim().charAt(0) === '|') tb.push(lines[i++]);
      i--;
      out.push(nvTableHtml(tb, depth));
      continue;
    }
    if (t.charAt(0) === '>') {
      flush();
      var qb = [], callout = '', title = '';
      while (i < lines.length && lines[i].trim().charAt(0) === '>') {
        var inner = lines[i].trim().replace(/^>\s?/, '');
        var c = inner.match(/^\[!([a-z]+)\][-+]?\s*(.*)$/i);
        if (c) { callout = c[1].toLowerCase(); title = c[2].trim(); inner = ''; }
        qb.push(inner);
        i++;
      }
      i--;
      out.push('<div class="callout callout-' + nvEsc(callout || 'note') + '">' +
        (title ? '<div class="callout-title">' + nvInline(title, depth + 1) + '</div>' : '') +
        nvMarkdown(qb.join('\n'), depth + 1) + '</div>');
      continue;
    }
    var li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      flush();
      var ordered = /\d/.test(li[2]);
      var items = [];
      while (i < lines.length) {
        var m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!m) {
          if (lines[i].trim() && /^\s+\S/.test(lines[i]) && items.length) { items[items.length - 1] += ' ' + lines[i].trim(); i++; continue; }
          break;
        }
        items.push(m[3]);
        i++;
      }
      i--;
      var tag = ordered ? 'ol' : 'ul';
      out.push('<' + tag + ' class="list">' + items.map(function (x) { return '<li>' + nvInline(x, depth) + '</li>'; }).join('') + '</' + tag + '>');
      continue;
    }
    para.push(t);
  }
  flush();
  return out.join('\n');
}

function nvCells(row) {
  return row.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, '|'); });
}
function nvTableHtml(rows, depth) {
  if (rows.length < 2) return '';
  var head = nvCells(rows[0]);
  var body = rows.slice(2).map(nvCells);
  return '<div class="table-wrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + nvInline(c, depth) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + nvInline(c, depth) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div>';
}

function nvEmbedHtml(inner, depth) {
  var e = (nvRange().embeds || {})[inner];
  if (!e) return '<div class="embed embed-broken">Embed not resolved: ' + nvEsc(inner) + '</div>';
  if (e.image) return '<div class="embed embed-broken"><div class="embed-src">Image — ' + nvEsc(e.name) + '</div>Images are opened on the Console.</div>';
  if (!e.ok) return '<div class="embed embed-broken"><div class="embed-src">Embed does not resolve — ' + nvEsc(inner) + '</div>' + nvEsc(e.error || 'unknown reason') + '</div>';
  var body = depth >= 1
    ? '<p class="dim">This section embeds further sections — open ' + nvEsc(e.source) + ' to read them.</p>'
    : nvMarkdown(e.body, depth + 1);
  var note = String(e.source || '').split(' › ')[0];
  var hit = (nvRange().links || {})[note];
  return '<figure class="embed"><figcaption class="embed-src">' + (hit ? nvLinkTag(hit, nvEsc(e.source)) : nvEsc(e.source)) +
    '</figcaption><div class="embed-body">' + body + '</div></figure>';
}

function nvInline(raw, depth) {
  var slots = [];
  var slot = function (html) { slots.push(html); return '\u0000' + (slots.length - 1) + '\u0001'; };
  var s = String(raw == null ? '' : raw);
  s = s.replace(/!\[\[([^\]]+)\]\]/g, function (m, inner) { return slot(nvInlineEmbedHtml(inner)); });
  s = s.replace(/\[\[([^\]]+)\]\]/g, function (m, inner) { return slot(nvLinkHtml(inner)); });
  s = s.replace(/`([^`]+)`/g, function (m, code) { return slot('<code>' + nvEsc(code) + '</code>'); });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, text, href) { return slot('<span class="extlink" title="' + nvEsc(href) + '">' + nvEsc(text) + '</span>'); });
  s = nvEsc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/==([^=]+)==/g, '<mark>$1</mark>');
  s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  return s.replace(/\u0000(\d+)\u0001/g, function (m, i) { return slots[Number(i)]; });
}
function nvInlineEmbedHtml(inner) {
  var e = (nvRange().embeds || {})[inner];
  if (e && e.ok) return '<span title="Embedded from ' + nvEsc(e.source) + '">' + nvEsc(e.body.split('\n')[0]) + '</span>';
  return '<span class="dangling">![[' + nvEsc(inner) + ']]</span>';
}
function nvLinkHtml(inner) {
  var bar = inner.lastIndexOf('|');
  var target = (bar === -1 ? inner : inner.slice(0, bar)).trim();
  var alias = (bar === -1 ? '' : inner.slice(bar + 1)).trim();
  var hash = target.indexOf('#');
  var note = (hash === -1 ? target : target.slice(0, hash)).trim();
  var label = nvEsc(alias || target);
  if (!note) return '<span>' + label + '</span>';
  var hit = (nvRange().links || {})[note];
  if (!hit) return '<span class="dangling" title="No note called “' + nvEsc(note) + '” — an unwritten link is this range\'s backlog">' + label + '</span>';
  return nvLinkTag(hit, label);
}

// ════════════════════════════════════════════════════════════
// The paper — a document built by one of the Console's own
// builders, written into a frame, and let out to the phone's width
// ════════════════════════════════════════════════════════════

// The documents are sized for paper (Letter, a half sheet, landscape for a
// JSA). On a phone the page is let out to the screen's width instead: the
// same document, the same words, reflowed. Wide tables scroll sideways.
var NV_PAPER_CSS = '@media screen {' +
  ' html { background: #fff; }' +
  ' body { width: auto !important; max-width: 100%; padding: 14px 12px 22px !important; font-size: 13.5px !important; overflow-wrap: anywhere; }' +
  ' img { max-width: 100%; height: auto; }' +
  ' table { max-width: 100%; }' +
  ' .grid, .facts, table.grid { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }' +
  ' .xref, a[data-id], a[data-code] { color: #0a6fa8; text-decoration: underline; }' +
  '}';

function nvPaper(host, html, onXref) {
  host.innerHTML = '<div class="paper-wrap"><iframe class="paper" title="The page"></iframe></div>';
  var frame = host.querySelector('iframe');
  var doc = frame.contentDocument;
  doc.open();
  doc.write(String(html).replace(/<\/head>/i, '<style>' + NV_PAPER_CSS + '</style></head>'));
  doc.close();
  doc.documentElement.style.overflow = 'hidden';
  var fit = function () { try { frame.style.height = Math.max(200, doc.documentElement.scrollHeight) + 'px'; } catch (e) {} };
  fit();
  Array.prototype.forEach.call(doc.images, function (img) { img.addEventListener('load', fit, { once: true }); });
  try { new ResizeObserver(fit).observe(doc.body); } catch (e) { setTimeout(fit, 80); }
  setTimeout(fit, 300);
  doc.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('.xref');
    if (!a) return;
    e.preventDefault();
    if (onXref) onXref(a.dataset);
  });
}

function nvLetterhead() {
  var l = NV.files['letterhead.json'] || {};
  return { setup: l.setup || { companyLogoAlign: 'left', vesselIconAlign: 'right', secondaryColor: '#222222', headerColor: '#555555' },
           vessel: l.vessel || 'F/T Araho' };
}

// SOPs, Jobs, KSAs (Console: navipedia-cards.js)

var NV_KSA_FILTERS = [['all', 'All'], ['knowledge', 'Knowledge'], ['skill', 'Skills — global'], ['vessel', 'Skills — vessel']];
function nvP() { return window.navipediaCardsPrint; }
function nvCards() { return NV.files['cards.json']; }
function nvShort(id) { return window.ksaView ? ksaView.shortId(id) : String(id || ''); }
function nvPlain(t) { return window.ksaView ? ksaView.plainTitle(t) : String(t || ''); }
function nvCardById(id) {
  var c = nvCards();
  if (!c || !c.notes) return null;
  var hit = c.notes.filter(function (r) { return r.id === id; })[0];
  if (hit) return hit;
  var s = nvShort(id);
  return c.notes.filter(function (r) { return nvShort(r.id) === s; })[0] || null;
}
function nvOpenCard(id) {
  nvFile('cards.json').then(function () {
    var rec = nvCardById(id);
    if (!rec) { nvToast(id + ' is not in the card index.'); return; }
    nvGo({ v: 'card', id: rec.id });
  }, function () { nvToast('The cards are not on this phone yet, and OneDrive could not be reached.'); });
}
function nvInSection(section) {
  var S = nvP().SECTIONS[section];
  return (nvCards().notes || []).filter(S.has);
}
function nvCardsFiltered(section) {
  var cards = nvInSection(section);
  if (section === 'ksas' && NV.ksaFilter !== 'all') {
    cards = cards.filter(function (r) {
      var k = nvP().competencyKind(r);
      if (!k) return false;
      if (NV.ksaFilter === 'knowledge') return k.kind === 'knowledge';
      if (NV.ksaFilter === 'skill') return k.kind === 'skill' && k.scope === 'global';
      if (NV.ksaFilter === 'vessel') return k.kind === 'skill' && k.scope === 'vessel';
      return true;
    });
  }
  return cards;
}
// npcGrouped: SOPs and jobs by machine, global tasks first; knowledge and
// skills by kind, then category.
function nvCardsGrouped(section, cards) {
  var P = nvP();
  var keyed = cards.map(function (rec) {
    var order, label;
    if (section === 'ksas') {
      var k = P.competencyKind(rec) || { kind: 'skill', scope: 'global' };
      var head = k.kind === 'knowledge' ? 'Knowledge' : k.scope === 'vessel' ? 'Vessel skills' : 'Skills';
      order = k.kind === 'knowledge' ? '0' : k.scope === 'vessel' ? '2' : '1';
      label = head + ' — ' + ([rec.category, rec.subcategory].filter(Boolean).join(' › ') || 'Uncategorised');
    } else if (rec.family === 'TASK') { order = '0'; label = 'Global tasks'; }
    else { order = rec.asset ? '1' : '2'; label = rec.asset || 'No asset stated'; }
    return { rec: rec, label: label, sort: order + ' ' + label.toLowerCase() };
  });
  keyed.sort(function (a, b) {
    return a.sort.localeCompare(b.sort, undefined, { numeric: true }) ||
           String(a.rec.id).localeCompare(String(b.rec.id), undefined, { numeric: true });
  });
  return keyed;
}
function nvCardRow(rec, section, query, other) {
  var P = nvP();
  var chips = [];
  if (section === 'sops' && rec.is_job) chips.push('<span class="tag">Job</span>');
  if (rec.is_stub) chips.push('<span class="tag warn">Stub</span>');
  if (other) chips.push('<span class="tag accent">' + nvEsc(P.SECTIONS[other].label) + '</span>');
  var sub = query ? [P.docKind(rec), rec.asset || [rec.category, rec.subcategory].filter(Boolean).join(' › ')].filter(Boolean).join(' · ') : '';
  return '<button class="row" data-id="' + nvEsc(rec.id) + '"><span class="row-id">' + nvEsc(nvShort(rec.id)) + '</span>' +
    '<span class="row-main">' + (query ? nvHighlight(nvPlain(rec.title), query) : nvEsc(nvPlain(rec.title))) +
    (sub ? '<span class="row-sub">' + nvEsc(sub) + '</span>' : '') + '</span>' + chips.join('') + '</button>';
}

NV_VIEWS.cards = {
  title: function (view) { return { sops: 'SOPs', jobs: 'Jobs', ksas: 'KSAs' }[view.section] || 'Cards'; },
  needs: ['cards.json'],
  loadingText: 'Reading the card index…',
  render: function (view, body) {
    var c = nvCards();
    if (c.ok === false) { body.innerHTML = nvFileError('cards.json'); return; }
    var section = view.section;
    var noun = { sops: 'SOPs and global tasks', jobs: 'jobs', ksas: 'knowledge and skills' }[section];
    body.innerHTML = '<div class="search"><input type="search" id="cd-q" autocomplete="off" spellcheck="false" placeholder="Search ' + nvEsc(noun) +
      ' — number, title, equipment…" value="' + nvEsc(NV.cardQuery[section]) + '"></div>' +
      (section === 'ksas' ? '<div class="chips" id="cd-f"></div>' : '') + '<div id="cd-list"></div>';
    var draw = function () {
      var P = nvP();
      var f = document.getElementById('cd-f');
      if (f) f.innerHTML = NV_KSA_FILTERS.map(function (x) { return '<button class="chip-btn' + (NV.ksaFilter === x[0] ? ' on' : '') + '" data-filter="' + x[0] + '">' + nvEsc(x[1]) + '</button>'; }).join('');
      var q = NV.cardQuery[section];
      var cards = nvCardsFiltered(section);
      var out = '';
      if (q.trim()) {
        // Hits here first, then a few from the other two sections — an SOP
        // number typed into Jobs is the commonest miss (npcHits).
        var here = P.search(cards, q, 30);
        var seen = {};
        here.forEach(function (r) { seen[r.id] = 1; });
        var elsewhere = [];
        Object.keys(P.SECTIONS).filter(function (s) { return s !== section; }).forEach(function (s) {
          P.search(nvInSection(s), q, 4).forEach(function (rec) { if (!seen[rec.id]) { seen[rec.id] = 1; elsewhere.push({ rec: rec, section: s }); } });
        });
        out += '<div class="count">' + here.length + (here.length === 30 ? '+' : '') + ' match' + (here.length === 1 ? '' : 'es') + '</div>';
        here.forEach(function (r) { out += nvCardRow(r, section, q); });
        if (!here.length) out += '<div class="empty">No card here matches “' + nvEsc(q) + '”.</div>';
        if (elsewhere.length) {
          out += '<div class="list-group">In other sections</div>';
          elsewhere.slice(0, 5).forEach(function (h) { out += nvCardRow(h.rec, section, q, h.section); });
        }
      } else {
        out += '<div class="count">' + cards.length + ' ' + (cards.length === 1 ? 'card' : 'cards') + '</div>';
        var group = null;
        nvCardsGrouped(section, cards).forEach(function (g) {
          if (g.label !== group) { group = g.label; out += '<div class="list-group">' + nvEsc(group) + '</div>'; }
          out += nvCardRow(g.rec, section, '');
        });
        if (!cards.length) out += '<div class="empty">Nothing here.</div>';
      }
      document.getElementById('cd-list').innerHTML = out;
    };
    draw();
    body.oninput = function (e) { if (e.target.id === 'cd-q') { NV.cardQuery[section] = e.target.value; draw(); } };
    body.onclick = function (e) {
      var f = e.target.closest('[data-filter]');
      if (f) { NV.ksaFilter = f.dataset.filter; draw(); return; }
      var row = e.target.closest('[data-id]');
      if (row) nvGo({ v: 'card', id: row.dataset.id });
    };
  }
};

NV_VIEWS.card = {
  title: function (view) { return nvShort(view.id); },
  needs: ['cards.json', 'letterhead.json'],
  loadingText: 'Reading the card…',
  render: function (view, body) {
    var P = nvP();
    var rec = nvCardById(view.id);
    if (!rec) { body.innerHTML = '<div class="empty">' + nvEsc(view.id) + ' is not in the card index.</div>'; return; }
    var note = nvCards().bodies[rec.id];
    var meta = [
      rec.revision !== '' && rec.revision != null ? 'Rev ' + rec.revision : '',
      rec.revised ? 'Revised ' + rec.revised : '',
      rec.status ? 'Status: ' + rec.status : '',
      rec.approved_by ? 'Approved by ' + rec.approved_by : ''
    ].filter(Boolean).join('  ·  ');
    var html = '<div class="head"><div class="kicker">' + nvEsc(P.docKind(rec)) + (rec.asset ? ' · ' + nvEsc(rec.asset) : '') + '</div>' +
      '<div class="title"><span class="tid">' + nvEsc(nvShort(rec.id)) + '</span>' + nvEsc(nvPlain(rec.title)) + '</div>' +
      '<div class="meta">' + nvEsc(meta) + '</div></div>' +
      '<div class="seg" role="group" aria-label="Format">' +
      '<button data-format="sheet" class="' + (NV.cardFormat === 'sheet' ? 'on' : '') + '">Sheet — the whole card</button>' +
      '<button data-format="card" class="' + (NV.cardFormat === 'card' ? 'on' : '') + '">Card — the doing part</button></div>' +
      nvUsedByHtml(rec, view) + '<div id="cd-paper"></div>';
    body.innerHTML = html;
    var host = document.getElementById('cd-paper');
    if (!note || note.error) { host.innerHTML = '<div class="warn-box">' + nvEsc((note && note.error) || 'The card was not published.') + '</div>'; }
    else {
      var steps = nvCards().steps || {};
      var lh = nvLetterhead();
      var doc = P.buildDocument(rec, note, {
        format: NV.cardFormat, corpus: nvCards().notes, setup: lh.setup, vessel: lh.vessel,
        printedAt: new Date(), issuedLine: false, interactive: true,
        // The Console parsed every step block when it published; the phone
        // looks the answer up rather than carrying sop-editor.js.
        parseSteps: function (fence) { return steps[nvFingerprint(fence)] || null; }
      });
      nvPaper(host, doc, function (d) { if (d.id) nvOpenCard(d.id); });
    }
    body.oninput = null;
    body.onclick = function (e) {
      var s = e.target.closest('[data-format]');
      if (s) { NV.cardFormat = s.dataset.format; nvRender(); return; }
      if (e.target.closest('[data-usedby-more]')) { view.usedByAll = true; nvRender(); return; }
      var u = e.target.closest('[data-usedby]');
      if (u) nvGo({ v: 'card', id: u.dataset.usedby });
    };
  }
};

// npcUsedByHtml: for a knowledge or skill, the cards that ask for it.
function nvUsedByHtml(rec, view) {
  if (nvP().homeSection(rec) !== 'ksas') return '';
  var s = nvShort(rec.id);
  var users = (nvCards().notes || []).filter(function (c) {
    return (c.requires_ksa || []).some(function (raw) {
      var m = String(raw).match(/\[\[([^\]|]+)/) || String(raw).match(/^([A-Za-z]{3}-[\w.-]+)/);
      return m && (m[1].trim() === rec.id || nvShort(m[1].trim()) === s);
    });
  });
  if (!users.length) return '<div class="usedby"><span class="lbl">Required by</span><span class="dim">no card names this yet</span></div>';
  var CAP = 14;
  var shown = view.usedByAll ? users : users.slice(0, CAP);
  var more = users.length - shown.length;
  return '<div class="usedby"><span class="lbl">Required by ' + users.length + '</span>' +
    shown.map(function (c) { return '<button class="pill" data-usedby="' + nvEsc(c.id) + '" title="' + nvEsc(nvPlain(c.title)) + '">' + nvEsc(nvShort(c.id)) + '</button>'; }).join('') +
    (more > 0 ? '<button class="chip-btn" data-usedby-more="1">and ' + more + ' more</button>' : '') + '</div>';
}

var NV_JSA_FILTERS = [['all', 'All'], ['draft', 'Drafts'], ['signed', 'Signed']];

NV_VIEWS.jsas = {
  title: function () { return 'JSA'; },
  needs: ['jsa.json'],
  loadingText: 'Reading the JSAs…',
  render: function (view, body) {
    var J = NV.files['jsa.json'];
    if (J.ok === false) { body.innerHTML = nvFileError('jsa.json'); return; }
    body.innerHTML = '<div class="search"><input type="search" id="js-q" placeholder="Search — number, task, machine, who signed…" value="' + nvEsc(NV.jsaQuery) + '"></div>' +
      '<div class="chips" id="js-f"></div><div id="js-list"></div>';
    var draw = function () {
      document.getElementById('js-f').innerHTML = NV_JSA_FILTERS.map(function (x) {
        return '<button class="chip-btn' + (NV.jsaFilter === x[0] ? ' on' : '') + '" data-filter="' + x[0] + '">' + x[1] + '</button>';
      }).join('');
      var q = NV.jsaQuery.trim().toLowerCase();
      var list = (J.rows || []).filter(function (r) {
        if (NV.jsaFilter === 'draft' && r.approved_by) return false;
        if (NV.jsaFilter === 'signed' && !r.approved_by) return false;
        if (!q) return true;
        var hay = [r.id, r.title, r.asset, r.department, r.titles, r.approved_by, r.author, r.date].filter(Boolean).join(' ').toLowerCase();
        return q.split(/\s+/).every(function (t) { return hay.indexOf(t) !== -1; });
      });
      var out = '<div class="count">' + list.length + ' ' + (list.length === 1 ? 'JSA' : 'JSAs') + '</div>';
      if (!list.length) out += '<div class="empty">' + ((J.rows || []).length ? 'Nothing matches.' : 'No JSAs in the vault yet. They are written on the Console, under Navipedia → JSA.') + '</div>';
      // Grouped by the machine — somebody looking for one is standing at a pump.
      var groups = {};
      list.forEach(function (r) { var k = r.asset || '— no component named —'; (groups[k] = groups[k] || []).push(r); });
      Object.keys(groups).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); }).forEach(function (k) {
        out += '<div class="list-group">' + nvEsc(k) + '</div>';
        groups[k].forEach(function (r) {
          out += '<button class="row" data-id="' + nvEsc(r.id) + '"><span class="row-main"><span class="row-id">' + nvEsc(r.id) + '</span> ' +
            (r.approved_by ? '<span class="tag ok">signed</span>' : '<span class="tag warn">draft</span>') +
            (r.built_with === 'composed' ? ' <span class="tag">composed</span>' : '') +
            '<span style="display:block;margin-top:3px">' + nvEsc(r.title || '(untitled)') + '</span>' +
            '<span class="row-sub">' + nvEsc(r.date || 'undated') + (r.approved_by ? ' · ' + nvEsc(r.approved_by) : r.author ? ' · ' + nvEsc(r.author) : '') + '</span></span></button>';
        });
      });
      document.getElementById('js-list').innerHTML = out;
    };
    draw();
    body.oninput = function (e) { if (e.target.id === 'js-q') { NV.jsaQuery = e.target.value; draw(); } };
    body.onclick = function (e) {
      var f = e.target.closest('[data-filter]');
      if (f) { NV.jsaFilter = f.dataset.filter; draw(); return; }
      var row = e.target.closest('[data-id]');
      if (row) nvGo({ v: 'jsa', id: row.dataset.id });
    };
  }
};
