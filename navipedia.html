function nvEL() { return window.electricalLookup; }
function nvEix() {
  if (!NV.ix.elec) NV.ix.elec = nvEL().build(NV.files['electrical.json']);
  return NV.ix.elec;
}
function nvEgo(ev) { nvGo({ v: 'elec', ev: ev }); }

function nvEViewFor(text) {
  var ix = nvEix(), L = nvEL();
  var ref = L.parseBreakerRef(ix, text);
  var p = ix.resolvePanel(text);
  if (p) return { kind: 'panel', panel: p.name };
  if (ref) return { kind: 'breaker', panel: ref.panel.name, br: ref.br };
  return { kind: 'item', query: text };
}
function nvECanonDeck(name) {
  var decks = (NV.files['electrical.json'] || {}).decks || [];
  var f = String(name || '').toLowerCase().trim();
  if (!f) return '';
  var alias = { 'second deck': '2nd deck', 'first deck': '1st deck', 'truck deck': 'trunk deck', 'bridge': 'bridge deck' }[f] || f;
  return decks.filter(function (d) { return d.toLowerCase() === alias; })[0] || name;
}
function nvEPanelsByDeck() {
  var L = nvEL(), ix = nvEix();
  var decks = (NV.files['electrical.json'].decks || []).slice();
  var groups = {};
  ix.panels.forEach(function (p) {
    var loc = L.locate(ix, p);
    var deck = nvECanonDeck(loc.deck) || 'Location not recorded';
    (groups[deck] = groups[deck] || []).push({ p: p, loc: loc });
  });
  var order = function (d) { var i = decks.indexOf(d); return i < 0 ? 999 : i; };
  return Object.keys(groups).sort(function (a, b) { return order(a) - order(b) || a.localeCompare(b); })
    .map(function (d) { return [d, groups[d]]; });
}
function nvEPanelLink(name) {
  var p = nvEix().byName.get(name);
  return '<button class="lnk" data-go-panel="' + nvEsc(name) + '">' + nvEsc(p ? (p.panel || p.name) : name) + '</button>';
}
function nvEBreakerLink(panel, br, text) {
  var p = nvEix().byName.get(panel);
  return '<button class="lnk" data-go-breaker="' + nvEsc(panel) + '|' + br + '">' + nvEsc(text || ((p ? (p.panel || p.name) : panel) + ' br ' + br)) + '</button>';
}
function nvECaveat() { return '<div class="caveat">⚠ ' + nvEsc(nvEL().CAVEAT) + '</div>'; }
function nvEHead(title, meta, chips) {
  return '<div class="head"><div class="title">' + title + '</div>' + (meta ? '<div class="meta">' + meta + '</div>' : '') +
    (chips ? '<div style="margin-top:6px">' + chips + '</div>' : '') + '</div>';
}

NV_VIEWS.elec = {
  title: function (view) {
    var ev = view.ev || {};
    if (ev.kind === 'panel') return 'Panel ' + ev.panel;
    if (ev.kind === 'breaker') return ev.panel + ' br ' + ev.br;
    if (ev.kind === 'item') return ev.component ? String(ev.component).split(' ')[0] : '“' + ev.query + '”';
    if (ev.kind === 'space') return ev.space;
    return 'Electrical Distribution';
  },
  needs: ['electrical.json'],
  loadingText: 'Reading the panel schedule…',
  render: function (view, body) {
    var m = NV.files['electrical.json'];
    if (m.ok === false) { body.innerHTML = nvFileError('electrical.json'); return; }
    var ev = view.ev || { kind: 'home' };
    var html;
    if (ev.kind === 'panel')        html = nvEPanelView(ev.panel);
    else if (ev.kind === 'breaker') html = nvEBreakerView(ev.panel, ev.br);
    else if (ev.kind === 'item')    html = nvEItemView(ev);
    else if (ev.kind === 'space')   html = nvESpaceView(ev.space);
    else                            html = nvEHomeView();
    body.innerHTML = html;
    nvEHydrateDrawings();
    if (ev.kind === 'home') nvEWireSearch();
    else body.oninput = null;
    body.onclick = function (e) {
      var t = e.target.closest('[data-go-panel],[data-go-breaker],[data-go-item],[data-go-item-q],[data-go-space],[data-ac],[data-card]');
      if (!t) return;
      if (t.dataset.goBreaker) { var pb = t.dataset.goBreaker.split('|'); nvEgo({ kind: 'breaker', panel: pb[0], br: Number(pb[1]) }); }
      else if (t.dataset.goPanel) nvEgo({ kind: 'panel', panel: t.dataset.goPanel });
      else if (t.dataset.goItemQ) nvEgo({ kind: 'item', query: t.dataset.goItemQ });
      else if (t.dataset.goItem) nvEgo({ kind: 'item', query: t.dataset.goItem, component: t.dataset.goItem });
      else if (t.dataset.goSpace) nvEgo({ kind: 'space', space: t.dataset.goSpace });
      else if (t.dataset.card) nvOpenCard(t.dataset.card);
      else if (t.dataset.ac != null) {
        var h = NV.elecHits[Number(t.dataset.ac)];
        if (h) nvEPick(h);
      }
    };
  }
};

function nvEPick(h) {
  var q = NV.elecQuery.trim();
  NV.elecQuery = '';
  if (h.kind === 'panel') nvEgo({ kind: 'panel', panel: h.panel });
  else if (h.kind === 'breaker') nvEgo({ kind: 'breaker', panel: h.panel, br: h.br });
  else if (h.kind === 'component') nvEgo({ kind: 'item', query: q, component: h.component.note });
  else nvEgo({ kind: 'item', query: h.query });
}

function nvEWireSearch() {
  var body = document.getElementById('body');
  var draw = function () {
    var box = document.getElementById('el-ac');
    var ix = nvEix(), L = nvEL();
    var q = NV.elecQuery;
    if (!q.trim()) { box.innerHTML = ''; document.getElementById('el-home').hidden = false; return; }
    document.getElementById('el-home').hidden = true;
    var hits = NV.elecHits = L.suggest(ix, q, { limit: 14 });
    var heads = { panel: 'Panels', breaker: 'Breakers', component: 'Equipment register', search: '' };
    var html = '', last = null;
    hits.forEach(function (h, i) {
      if (h.kind !== last && heads[h.kind]) html += '<div class="list-group">' + heads[h.kind] + '</div>';
      last = h.kind;
      var main = '', sub = '';
      if (h.kind === 'panel') {
        var p = ix.byName.get(h.panel);
        main = '<span class="kind panel">Panel</span> <b>' + nvHighlight(p.panel || p.name, q) + '</b> <span class="dim">' + nvEsc(p.system) + '</span>';
        sub = L.locate(ix, p).where;
      } else if (h.kind === 'breaker') {
        var pb = ix.byName.get(h.panel);
        main = '<span class="kind breaker">Breaker</span> <b>' + nvEsc((pb.panel || pb.name) + ' br ' + h.br) + '</b> ' +
          (h.held === false ? '<em>not on the schedule</em>' : nvHighlight(h.label || '(unlabeled)', q));
        sub = L.locate(ix, pb).where;
      } else if (h.kind === 'component') {
        var c = h.component;
        main = '<span class="kind item">' + (c.group ? 'Group' : 'Item') + '</span> <span class="row-id">' + nvEsc(c.code) + '</span> ' + nvHighlight(c.name, q);
        sub = h.supply ? 'Fed from ' + h.supply.map(function (s) { return s.panel + ' br ' + s.br; }).join(', ')
            : (c.group ? 'Group — the machines beneath it' : 'No crosswalked breaker — the schedule’s labels will be searched');
      } else {
        main = '<span class="kind">All</span> Everything that names “' + nvEsc(h.query) + '”' + (h.total > 14 ? ' — ' + h.total + ' hits' : '');
      }
      html += '<button class="row" data-ac="' + i + '"><span class="row-main">' + main + (sub ? '<span class="row-sub">' + nvEsc(sub) + '</span>' : '') + '</span></button>';
    });
    box.innerHTML = html || '<div class="empty">Nothing matches “' + nvEsc(q) + '”.</div>';
  };
  body.oninput = function (e) { if (e.target.id === 'el-q') { NV.elecQuery = e.target.value; draw(); } };
  var input = document.getElementById('el-q');
  input.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var h = (NV.elecHits || [])[0];
    if (h && NV.elecQuery.trim()) nvEPick(h);
  });
  draw();
}

function nvEHomeView() {
  var ix = nvEix(), L = nvEL(), m = NV.files['electrical.json'];
  var positions = ix.panels.reduce(function (n, p) { return n + p.breakers.length; }, 0);
  var onMap = {};
  ix.panels.forEach(function (p) {
    var loc = L.locate(ix, p);
    if (!loc.map) return;
    var bySpace = onMap[loc.map.name] = onMap[loc.map.name] || {};
    (bySpace[loc.map.space] = bySpace[loc.map.space] || []).push(p);
  });
  var maps = '';
  ix.maps.forEach(function (map) {
    var bySpace = onMap[map.name] || {};
    var markers = Object.keys(bySpace).map(function (space) {
      var list = bySpace[space];
      return { rect: map.spaces[space], space: space, label: space + ' · ' + list.length,
               title: ((ix.spaces[space] || {}).name || space) + ': ' + list.map(function (p) { return p.panel || p.name; }).join(', ') };
    });
    maps += '<section class="sec"><h3>' + nvEsc(map.name) + ' <span class="sub">— ' + markers.length + ' spaces with panels; tap one</span></h3>' + nvEDrawingHtml(map, markers) + '</section>';
  });
  var ladder = nvEPanelsByDeck().map(function (d) {
    var list = d[1].slice().sort(function (a, b) { return a.p.name.localeCompare(b.p.name, undefined, { numeric: true }); });
    return '<div class="ladder-row"><div class="ladder-deck">' + nvEsc(d[0]) + '</div><div class="ladder-pills">' + list.map(function (x) {
      return '<button class="pill' + (x.p.locationOnly ? ' dash' : '') + '" data-go-panel="' + nvEsc(x.p.name) + '">' + nvEsc(x.p.panel || x.p.name) + '</button>';
    }).join('') + '</div></div>';
  }).join('');
  return '<div class="search"><input type="search" id="el-q" autocomplete="off" spellcheck="false" placeholder="Panel, breaker (LP3 23), machine or code…" value="' + nvEsc(NV.elecQuery) + '"></div>' +
    '<div id="el-ac"></div><div id="el-home">' +
    '<div class="meta" style="margin:0 2px 8px">' + ix.panels.length + ' panels · ' + positions + ' breaker positions, ' + ix.labels.length + ' labelled · ' +
      ix.supply.size + ' crosswalked to the equipment register · mirror generated ' + nvEsc((ix.panels[0] || {}).generated || '—') + '</div>' +
    '<div class="md" style="font-size:14px"><p>Search a <b>panel</b> (<code>P405</code>), a <b>breaker</b> (<code>LP3 23</code>) or an <b>item</b> — a machine, a code (<code>702.005</code>) or a label\'s words (<code>fuel oil</code>, <code>lights or lighting</code>, <code>pump not bilge</code>).</p></div>' +
    (maps || '<div class="note-box">No deck map in <code>0.8.1 The Ship</code> carries Space Register cards yet, so panels are placed by deck and room only.</div>') +
    '<section class="sec"><h3>By deck</h3>' + ladder + '</section>' +
    (m.spacesError ? '<div class="note-box">The Space Register (spaces.json) could not be read: ' + nvEsc(m.spacesError) + '</div>' : '') + '</div>';
}

function nvELocationHtml(p) {
  var L = nvEL(), ix = nvEix();
  var loc = L.locate(ix, p);
  var deck = nvECanonDeck(loc.deck);
  var spaces = loc.spaces.map(function (s) { return '<button class="lnk" data-go-space="' + nvEsc(s.id) + '">' + nvEsc(s.id) + '</button> ' + nvEsc(s.name); }).join(' or ');
  var facts = [
    ['Deck', nvEsc(p.deck || '—')], ['Room', nvEsc(p.room || '—')], ['Position', nvEsc(p.position || '—')],
    p.scheduleLocation ? ['Schedule sheet says', nvEsc(p.scheduleLocation)] : null,
    ['Space', spaces || '<span class="dim">no Space Register entry names this room</span>']
  ].filter(Boolean);
  var drawing = loc.map
    ? '<div class="drawing-cap">' + nvEsc(loc.map.name) + ' — the <b>' + nvEsc(loc.map.space) + '</b> card as laid on the drawing. The panel is <b>' + nvEsc(p.position || 'somewhere') + '</b> inside that room.</div>' +
      nvEDrawingHtml(ix.maps.filter(function (m) { return m.name === loc.map.name; })[0], [{ rect: loc.map.rect, space: loc.map.space, label: p.panel || p.name, on: true }])
    : '<div class="note-box">No deck map places ' + nvEsc(deck || 'this deck') + ' yet.</div>';
  return '<table class="facts">' + facts.map(function (f) { return '<tr><th>' + f[0] + '</th><td>' + f[1] + '</td></tr>'; }).join('') + '</table>' +
    '<div class="figs">' + nvEDeckLadderSvg(deck) + nvERoomSvg(p.room, loc.inRoom, p.position) + '</div>' + drawing;
}

function nvEDeckLadderSvg(deck) {
  var decks = NV.files['electrical.json'].decks || [];
  if (!decks.length) return '';
  var rowH = 17, w = 190, h = decks.length * rowH + 6;
  var rows = decks.map(function (d, i) {
    var y = 3 + i * rowH, on = d === deck;
    return '<g class="' + (on ? 'deck-on' : 'deck') + '"><rect x="2" y="' + y + '" width="' + (w - 4) + '" height="' + (rowH - 3) + '" rx="3"/>' +
      '<text x="10" y="' + (y + rowH - 7) + '">' + nvEsc(d) + (on ? '  ◀' : '') + '</text></g>';
  }).join('');
  var found = decks.indexOf(deck) !== -1;
  return '<figure class="fig"><svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="Deck: ' + nvEsc(deck) + '">' + rows + '</svg>' +
    '<figcaption>' + (found ? 'Deck' : 'Deck “' + nvEsc(deck || '—') + '” is not in the Space Register list') + '</figcaption></figure>';
}

function nvERoomSvg(room, pos, words) {
  var w = 220, h = 124, x0 = 26, y0 = 20, rw = 168, rh = 84;
  var fx = { aft: 0.2, mid: 0.5, fwd: 0.8 }, fy = { port: 0.2, center: 0.5, stbd: 0.8 };
  var mark = '';
  if (pos.fa && pos.ps) mark = '<circle class="rdot" cx="' + (x0 + rw * fx[pos.fa]) + '" cy="' + (y0 + rh * fy[pos.ps]) + '" r="7"/>';
  else if (pos.fa) mark = '<rect class="band" x="' + (x0 + rw * fx[pos.fa] - 10) + '" y="' + (y0 + 3) + '" width="20" height="' + (rh - 6) + '" rx="6"/>';
  else if (pos.ps) mark = '<rect class="band" x="' + (x0 + 3) + '" y="' + (y0 + rh * fy[pos.ps] - 9) + '" width="' + (rw - 6) + '" height="18" rx="6"/>';
  var cap = pos.fa || pos.ps ? 'In the room: ' + nvEsc(words) : 'The schedule gives no side: “' + nvEsc(words || '—') + '”';
  return '<figure class="fig"><svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="' + nvEsc(cap) + '">' +
    '<rect class="room" x="' + x0 + '" y="' + y0 + '" width="' + rw + '" height="' + rh + '" rx="4"/>' +
    '<text class="room-name" x="' + (x0 + rw / 2) + '" y="' + (y0 + rh / 2 + 4) + '" text-anchor="middle">' + nvEsc(room || '') + '</text>' + mark +
    '<text class="axis" x="' + (x0 + rw / 2) + '" y="13" text-anchor="middle">PORT</text>' +
    '<text class="axis" x="' + (x0 + rw / 2) + '" y="' + (h - 4) + '" text-anchor="middle">STBD</text>' +
    '<text class="axis" x="' + (w - 2) + '" y="' + (y0 + rh / 2 + 4) + '" text-anchor="end">FWD</text>' +
    '<text class="axis" x="2" y="' + (y0 + rh / 2 + 4) + '">AFT</text></svg><figcaption>' + cap + '</figcaption></figure>';
}

function nvEDrawingHtml(map, markers) {
  if (!map) return '';
  var ms = markers.filter(function (m) { return m.rect; }).map(function (m) {
    var cx = (m.rect.x + m.rect.w / 2) * 100, cy = (m.rect.y + m.rect.h / 2) * 100;
    return '<button class="marker' + (m.on ? ' marker-on' : '') + '" style="left:' + cx + '%;top:' + cy + '%" data-go-space="' + nvEsc(m.space) + '" title="' + nvEsc(m.title || m.label) + '">' +
      '<span class="marker-dot"></span><span class="marker-label">' + nvEsc(m.label) + '</span></button>';
  }).join('');
  return '<div class="drawing" style="aspect-ratio:' + map.aspect + '" data-image="' + nvEsc(map.image) + '"><img alt="' + nvEsc(map.name) + ' deck drawing" hidden>' +
    '<div class="drawing-wait">Loading the drawing…</div>' + ms + '</div>';
}

// The drawings are their own file, fetched the first time one is on screen.
function nvEHydrateDrawings() {
  var els = document.querySelectorAll('#body .drawing[data-image]');
  if (!els.length) return;
  nvFile('electrical-images.json').then(function (f) {
    Array.prototype.forEach.call(els, function (el) {
      if (!el.isConnected) return;
      var res = (f.images || {})[el.dataset.image];
      var img = el.querySelector('img'), wait = el.querySelector('.drawing-wait');
      if (res && res.dataUrl) { img.src = res.dataUrl; img.hidden = false; if (wait) wait.remove(); }
      else if (wait) wait.textContent = 'The drawing could not be read: ' + ((res && res.error) || 'not published');
    });
  }, function () {
    Array.prototype.forEach.call(els, function (el) { var w = el.querySelector('.drawing-wait'); if (w) w.textContent = 'The drawing is not on this phone yet.'; });
  });
}

function nvEUpTreeHtml(nodes) {
  if (!nodes.length) return '';
  return '<ul class="tree">' + nodes.map(function (n) {
    return '<li><span class="arrow">↑</span> ' + nvEBreakerLink(n.panel, n.br) + ' <span class="dim">“' + nvEsc(n.label) + '”</span>' +
      (n.loop ? ' <span class="tag">loop — shown above</span>' : '') + (!n.known ? ' <span class="tag">not in the panel mirror</span>' : '') +
      nvEUpTreeHtml(n.up) + '</li>';
  }).join('') + '</ul>';
}
function nvEDownTreeHtml(nodes) {
  if (!nodes.length) return '';
  return '<ul class="tree">' + nodes.map(function (n) {
    var p = nvEix().byName.get(n.panel);
    var other = p && p.fedFrom.length > 1 ? ' <span class="tag">also fed from ' + (p.fedFrom.length - 1) + ' other</span>' : '';
    return '<li><span class="arrow">↓</span> br ' + n.br + ' → ' + nvEPanelLink(n.panel) + ' <span class="dim">“' + nvEsc(n.label) + '”</span>' + other +
      (n.loop ? ' <span class="tag">loop</span>' : nvEDownTreeHtml(n.down)) + '</li>';
  }).join('') + '</ul>';
}
function nvEUpstreamSection(p, heading) {
  var up = nvEL().upstream(nvEix(), p.name);
  return '<section class="sec"><h3>' + (heading || 'Fed from — back to the source') + '</h3>' +
    (up.length
      ? '<div>' + nvEPanelLink(p.name) + '</div>' + nvEUpTreeHtml(up) +
        (p.fedFrom.length > 1 ? '<div class="warn-box">' + nvEsc(p.panel || p.name) + ' is fed from ' + p.fedFrom.length + ' places. Opening one of them may not de-energise it.</div>' : '')
      : '<div class="dim small">No panel in the mirror names a feed to ' + nvEsc(p.panel || p.name) + '. It may be fed from a switchboard the schedule does not list, or from an unlabeled breaker — only the panel itself can say.</div>') +
    '</section>';
}
function nvECitedHtml(list) {
  if (!list.length) return '';
  return '<section class="sec"><h3>Cards that cite it</h3><div class="ladder-pills">' + list.map(function (c) {
    return '<button class="pill" data-card="' + nvEsc(c.note) + '">' + nvEsc(c.note) + (c.brs ? ' <span class="dim">br ' + c.brs.join(', ') + '</span>' : '') + '</button>';
  }).join('') + '</div></section>';
}

function nvEPanelView(name) {
  var ix = nvEix(), L = nvEL();
  var p = ix.byName.get(name);
  if (!p) return '<div class="empty">Panel ' + nvEsc(name) + ' is not in the panel mirror.</div>';
  var down = L.downstream(ix, p.name);
  var load = L.downstreamLoad(ix, p.name);
  var labelled = p.breakers.filter(function (b) { return !L.isEmptyLabel(b.label); }).length;
  var citedBrs = {};
  p.citedBy.forEach(function (c) { c.brs.forEach(function (br) { citedBrs[br] = (citedBrs[br] || 0) + 1; }); });
  var feedsAt = {};
  (ix.feeds.get(p.name) || []).forEach(function (f) { feedsAt[f.br] = f.panel; });
  var rows = p.breakers.map(function (b) {
    var comp = b.links.filter(function (l) { return l.kind === 'component'; }).map(function (l) {
      return '<button class="lnk small" data-go-item="' + nvEsc(l.note) + '">' + nvEsc(l.note.split(' ')[0]) + '</button>';
    }).join(' ');
    var fed = feedsAt[b.no] ? '→ ' + nvEPanelLink(feedsAt[b.no]) : '';
    var empty = L.isEmptyLabel(b.label);
    return '<tr class="' + (empty ? 'empty' : '') + '"><td class="num">' + nvEBreakerLink(p.name, b.no, String(b.no)) + '</td><td>' +
      (empty ? nvEsc(b.label || 'unlabeled') : nvEsc(b.label)) + (comp || fed ? '<div class="small">' + comp + ' ' + fed + '</div>' : '') +
      (citedBrs[b.no] ? ' <span class="tag">cited</span>' : '') + '</td></tr>';
  }).join('');
  var chips = (p.system ? '<span class="tag">' + nvEsc(p.system) + '</span> ' : '') + (p.locationOnly ? '<span class="tag dash">Location only</span>' : '');
  return nvEHead('Panel ' + nvEsc(p.display), p.locationOnly ? 'Placed by the Summary sheet; no schedule sheet lists its breakers' : p.breakers.length + ' positions, ' + labelled + ' labelled', chips) +
    '<section class="sec"><h3>Where it is</h3>' + nvELocationHtml(p) + '</section>' +
    (p.locationOnly ? '<div class="warn-box">Location only — the list on the panel door is the only list. Isolation points on this panel cannot be cited from the vault; read them at the panel and treat every one as [VERIFY].</div>' : '') +
    nvEUpstreamSection(p) +
    '<section class="sec"><h3>Feeds — what depends on it</h3>' +
    (down.length
      ? nvEDownTreeHtml(down) + '<div class="dim small" style="margin-top:6px">Downstream: ' + load.panels.length + ' panel' + (load.panels.length === 1 ? '' : 's') + ' carrying ' + load.circuits +
        ' labelled circuits, plus the ' + labelled + ' on this panel. ' + (load.multiFed.length ? load.multiFed.join(', ') + (load.multiFed.length === 1 ? ' has' : ' have') + ' another feed and may stay live.' : '') + '</div>'
      : '<div class="dim small">No other panel names ' + nvEsc(p.panel || p.name) + ' as its feed. What it serves is its own breaker schedule below.</div>') +
    '</section>' +
    (p.breakers.length ? '<section class="sec"><h3>Breaker schedule</h3><table class="brtable"><thead><tr><th class="num">Br</th><th>Circuit</th></tr></thead><tbody>' + rows + '</tbody></table></section>' : '') +
    nvECitedHtml(p.citedBy) + nvECaveat();
}

function nvEBreakerView(panelName, br) {
  var ix = nvEix(), L = nvEL();
  var r = L.serves(ix, panelName, br);
  var p = ix.byName.get(panelName);
  if (!p) return '<div class="empty">Panel ' + nvEsc(panelName) + ' is not in the panel mirror.</div>';
  var pname = p.panel || p.name;
  if (!r.found) return nvEHead(nvEsc(pname) + ' br ' + br) + '<div class="warn-box">Panel ' + nvEPanelLink(p.name) + ' has no breaker ' + br + ' in its schedule (positions held: ' + nvEsc(r.held) + ').</div>';
  var serves;
  if (r.locationOnly) serves = '<div class="warn-box">' + nvEsc(pname) + ' is location-only: no schedule sheet lists its breakers, so what br ' + br + ' serves cannot be read from the vault. Read it at the panel.</div>';
  else if (r.empty) serves = '<div class="dim">The position exists and carries no circuit label (' + nvEsc(r.breaker.label || 'unlabeled') + ').</div>';
  else {
    var comps = r.components.map(function (n) {
      return '<div class="serves-row"><span class="kind item">Item</span> <button class="lnk" data-go-item="' + nvEsc(n) + '">' + nvEsc(n) + '</button> <span class="tag ok">crosswalked</span></div>';
    }).join('');
    var panels = r.feedsPanels.map(function (n) {
      return '<div class="serves-row"><span class="kind panel">Panel</span> ' + nvEPanelLink(n) + ' <span class="dim">' + nvEsc(ix.byName.get(n) ? L.locate(ix, ix.byName.get(n)).where : '') + '</span></div>';
    }).join('');
    serves = comps + panels ||
      '<div class="dim">Not crosswalked to a register component — the label is the schedule\'s own words. Search it as an item to see every breaker that names the same thing: <button class="lnk" data-go-item-q="' + nvEsc(r.breaker.label) + '">' + nvEsc(r.breaker.label) + '</button></div>';
  }
  var cited = r.cited.map(function (n) { return { note: n, brs: null }; });
  return nvEHead(nvEsc(pname) + ' <span class="soft">br ' + br + '</span>' + (r.breaker && !r.empty ? ' — ' + nvEsc(r.breaker.label) : ''),
      'In panel ' + nvEPanelLink(p.name) + ' · ' + nvEsc(p.system || '')) +
    '<section class="sec"><h3>Serves</h3>' + serves + '</section>' +
    '<section class="sec"><h3>Where to walk — panel ' + nvEsc(pname) + '</h3>' + nvELocationHtml(p) + '</section>' +
    nvEUpstreamSection(p, 'Upstream of ' + nvEsc(pname)) + nvECitedHtml(cited) + nvECaveat();
}

function nvEItemView(v) {
  var ix = nvEix(), L = nvEL();
  var component = v.component ? ix.equipByNote.get(v.component) : null;
  var r = L.feedsOf(ix, { query: v.query || v.component, component: component });
  var register;
  if (component) {
    register = r.linked.length
      ? '<span class="tag ok">crosswalked</span> The crosswalk links ' + nvEsc(component.note) + ' to a breaker.'
      : component.group
        ? nvEsc(component.note) + ' is a group, not a machine — it has no breaker of its own. ' + (r.group && r.group.children.length
            ? r.group.children.length + ' unit' + (r.group.children.length === 1 ? '' : 's') + ' beneath it carr' + (r.group.children.length === 1 ? 'ies' : 'y') + ' one.'
            : 'No unit beneath it carries a crosswalked supply, so the schedule’s labels were searched.')
        : nvEsc(component.note) + ' is in the register and the crosswalk gave it no breaker, so the schedule\'s labels were searched for “' + nvEsc(r.subject) + '”.';
  } else if (r.register.length) {
    register = r.linked.length
      ? r.register.length + ' register entr' + (r.register.length === 1 ? 'y matches' : 'ies match') + '; ' + r.linked.length + ' carr' + (r.linked.length === 1 ? 'ies' : 'y') + ' a crosswalked breaker.'
      : r.register.length + ' register entr' + (r.register.length === 1 ? 'y matches' : 'ies match') + '; none carries a crosswalked breaker, so the schedule\'s labels were searched.';
  } else {
    register = 'Nothing in the equipment register matches “' + nvEsc(r.query) + '”. The schedule\'s labels were searched anyway.';
  }
  var title = component ? '<span class="tid">' + nvEsc(component.code) + '</span><span class="soft">' + nvEsc(component.name) + '</span>' : '“' + nvEsc(r.query) + '”';
  if (!r.panels.length) {
    var diag = (r.diagnosis || []).map(function (d) {
      var terms = d.terms.map(function (a) { return '“' + nvEsc(a) + '”'; }).join(' or ');
      var why = d.dead ? 'That word is nowhere in the schedule' + (d.near.length ? '; it does use: ' + d.near.map(nvEsc).join(', ') : '') + '.'
                       : 'That word IS in the schedule, just never alongside the rest.';
      return '<li>Without ' + terms + ': ' + d.count + ' label' + (d.count === 1 ? '' : 's') + '. ' + why +
        (d.sample.length ? '<ul>' + d.sample.map(function (s) { return '<li>' + nvEBreakerLink(s.panel, s.br) + ' “' + nvEsc(s.label) + '”</li>'; }).join('') + '</ul>' : '') + '</li>';
    }).join('');
    return nvEHead(title, 'What it depends on') + '<div class="note-box">' + register + '</div>' +
      '<section class="sec"><h3>Not scheduled</h3><p class="small" style="line-height:1.5">Searched ' + r.panelCount + ' panel notes for ' + nvEsc(r.searched) + ' and no breaker label names it.</p>' +
      (diag ? '<ul class="diag">' + diag + '</ul><p class="dim small">Drop or respell that term and the rest of the search stands.</p>' : '') +
      '<p class="dim small">Many breaker positions are unlabeled — the machine may well be fed from one of them, and only the panel itself can say.</p></section>' +
      (r.register.length > 1 && !component ? nvERegisterList(r.register) : '');
  }
  var cards = r.panels.map(function (x) {
    var p = ix.byName.get(x.panel);
    if (!p) return '<div class="ecard">Panel ' + nvEsc(x.panel) + ' — not in the panel mirror</div>';
    var lines = x.rows.map(function (row) {
      return '<div class="serves-row">' + nvEBreakerLink(x.panel, row.br) + ' <span>“' + nvEsc(row.label) + '”</span> ' +
        (row.how === 'crosswalked' ? '<span class="tag ok">crosswalked</span>' : '<span class="tag warn">label match, unconfirmed</span>') + '</div>';
    }).join('');
    var up = L.upstream(ix, x.panel);
    return '<div class="ecard"><div class="ecard-head">' + nvEPanelLink(x.panel) + ' <span class="dim small">' + nvEsc(L.locate(ix, p).where) + '</span></div>' + lines +
      (up.length ? '<details class="chain"><summary>Upstream of ' + nvEsc(p.panel || p.name) + '</summary>' + nvEUpTreeHtml(up) + '</details>' : '') + '</div>';
  }).join('');
  var byMap = {};
  r.panels.forEach(function (x) {
    var p = ix.byName.get(x.panel);
    if (!p) return;
    var loc = L.locate(ix, p);
    if (!loc.map) return;
    var mm = byMap[loc.map.name] = byMap[loc.map.name] || {};
    if (!mm[loc.map.space]) mm[loc.map.space] = { rect: loc.map.rect, space: loc.map.space, labels: [], on: true };
    mm[loc.map.space].labels.push(p.panel || p.name);
  });
  var drawings = Object.keys(byMap).map(function (name) {
    var map = ix.maps.filter(function (m) { return m.name === name; })[0];
    return '<div class="drawing-cap">' + nvEsc(name) + '</div>' + nvEDrawingHtml(map, Object.keys(byMap[name]).map(function (k) {
      var x = byMap[name][k]; return { rect: x.rect, space: x.space, on: true, label: x.labels.join(', ') };
    }));
  }).join('');
  var off = r.panels.filter(function (x) { var p = ix.byName.get(x.panel); return p && !L.locate(ix, p).map; })
    .map(function (x) { var p = ix.byName.get(x.panel); return nvEPanelLink(x.panel) + ' <span class="dim">' + nvEsc(L.locate(ix, p).where) + '</span>'; });
  return nvEHead(title, 'Fed from ' + r.panels.length + ' panel' + (r.panels.length === 1 ? '' : 's')) +
    '<div class="note-box">' + register + '</div>' +
    (r.multiPanel ? '<div class="warn-box">More than one panel names this — isolating one may not de-energise it.</div>' : '') +
    (!r.linked.length && !(r.group && r.group.children.length) ? '<div class="note-box">Searched ' + r.panelCount + ' panel notes for ' + nvEsc(r.searched) + '. These are matches made by reading labels; the crosswalk has not confirmed them.</div>' : '') +
    '<section class="sec"><h3>Depends on</h3>' + cards + '</section>' +
    '<section class="sec"><h3>Where to walk</h3>' + drawings + (off.length ? '<div class="small" style="margin-top:8px;line-height:1.7">' + (drawings ? 'Not on a deck map yet: ' : '') + off.join(' · ') + '</div>' : '') + '</section>' +
    (r.register.length > 1 && !component ? nvERegisterList(r.register) : '') + nvECaveat();
}

function nvERegisterList(rows) {
  var ix = nvEix();
  var shown = rows.slice(0, 24);
  return '<section class="sec"><h3>Register entries that match</h3><div class="dim small">Named, not picked — open the one you mean.</div>' +
    shown.map(function (r) {
      return '<button class="row" data-go-item="' + nvEsc(r.note) + '"><span class="row-id">' + nvEsc(r.code) + '</span><span class="row-main">' + nvEsc(r.name) + '</span>' +
        (ix.supply.has(r.note) ? '<span class="tag ok">breaker</span>' : r.group ? '<span class="tag">group</span>' : '') + '</button>';
    }).join('') +
    (rows.length > shown.length ? '<div class="dim small">' + shown.length + ' of ' + rows.length + ' shown — narrow the search to see the rest.</div>' : '') + '</section>';
}

function nvESpaceView(id) {
  var ix = nvEix(), L = nvEL();
  var s = ix.spaces[id];
  var here = ix.panels.filter(function (p) { return L.locate(ix, p).spaces.some(function (x) { return x.id === id; }); });
  var map = ix.maps.filter(function (m) { return m.spaces[id]; })[0];
  var list = here.map(function (p) {
    return '<div class="serves-row">' + nvEPanelLink(p.name) + ' <span>' + nvEsc(p.position || '') + '</span> <span class="dim">' + nvEsc(p.system || '') + '</span>' +
      (p.locationOnly ? ' <span class="tag dash">Location only</span>' : '') + '</div>';
  }).join('');
  return nvEHead('<span class="tid">' + nvEsc(id) + '</span><span class="soft">' + nvEsc(s ? s.name : '') + '</span>', nvEsc(s ? s.deck : '')) +
    '<section class="sec"><h3>Panels in this space</h3>' + (list || '<div class="dim">The panel schedule places no panel here.</div>') + '</section>' +
    (map ? '<section class="sec"><h3>' + nvEsc(map.name) + '</h3>' + nvEDrawingHtml(map, [{ rect: map.spaces[id], space: id, label: id, on: true }]) + '</section>' : '');
}

// ════════════════════════════════════════════════════════════
// Diagnostics (Console: navipedia-diagnostics.js, less Upkeep)
// ════════════════════════════════════════════════════════════

var NV_HISTORIC = '__historic__';
var NV_SWEEP_CAP = 120;
var NV_LIST_CAP = 25;
var NV_TIER_TABS = [['tech', 'Service history'], [1, 'Tier 1 · The record'], [2, 'Tier 2 · This unit'], [3, 'Tier 3 · Beside it'], ['all', 'All tiers']];

function nvDL() { return window.diagnosticsLadder; }
function nvDR() { return window.diagnosticsReport; }

// ndxLoad, over the published files instead of IPC.
function nvDix() {
  if (NV.ix.diag) return NV.ix.diag;
  var L = nvDL();
  var d = NV.files['diagnostics.json'];
  var x = { notes: d.notes || [], meta: d.meta || {}, rows: [], roots: [], byCode: new Map(), childrenOf: new Map(), historic: [], units: [] };
  x.ix = L.indexNotes(x.notes);
  var reg = d.register || {};
  x.rows = reg.ok ? (reg.rows || []) : [];
  x.roots = reg.ok ? (reg.roots || []) : [];
  x.registerError = reg.ok ? null : (reg.error || 'The equipment register could not be read.');
  x.rows.forEach(function (r) { x.byCode.set(r.code, r); });
  x.rows.forEach(function (r) {
    if (!r.parent) return;
    if (!x.childrenOf.has(r.parent)) x.childrenOf.set(r.parent, []);
    x.childrenOf.get(r.parent).push(r.code);
  });
  var inReg = new Set(x.rows.map(function (r) { return L.normCode(r.code); }));
  var hist = new Map();
  x.notes.forEach(function (n) {
    [n.code].concat(n.covers || []).forEach(function (c) {
      var k = L.normCode(c);
      if (!c || inReg.has(k) || hist.has(k)) return;
      hist.set(k, { code: c, name: n.name, historic: true });
    });
  });
  (d.mirrorCodes || []).forEach(function (m) {
    var k = L.normCode(m.code);
    if (inReg.has(k)) return;
    var had = hist.get(k);
    if (!had) hist.set(k, { code: m.code, name: m.name || '(no longer named in the register)', historic: true });
    else if (!had.name && m.name) had.name = m.name;
  });
  x.historic = Array.from(hist.values()).sort(function (a, b) { return L.compareCodes(a.code, b.code); });
  x.units = x.rows.map(function (r) { return { code: r.code, name: r.name, retired: r.retired }; }).concat(x.historic);
  NV.ix.diag = x;
  return x;
}

// navipedia:diagnosticsRecord, over the published mirror: every mirror row
// filed under each asked code, with its jobs or without.
function nvDRecord(codes, jobs) {
  var L = nvDL();
  var j = NV.files['diagnostics-jobs.json'];
  if (!j || !j.mirror) return [];
  if (!NV.ix.mirror) {
    var by = new Map();
    j.mirror.forEach(function (r) {
      var k = L.normCode(r.asked || r.code);
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(r);
    });
    NV.ix.mirror = by;
  }
  var seen = new Set(), out = [];
  codes.forEach(function (raw) {
    var k = L.normCode(raw);
    if (!k || seen.has(k)) return;
    seen.add(k);
    (NV.ix.mirror.get(k) || []).forEach(function (r) {
      var row = Object.assign({}, r, { asked: raw });
      if (jobs) row.jobs = (r.jobs || []).map(function (x) { return Object.assign({}, x); });
      else delete row.jobs;
      out.push(row);
    });
  });
  return out;
}

// equip:detail, answered from the register and TM's critical table.
function nvDDetail(code) {
  var x = nvDix();
  var node = x.byCode.get(code);
  if (!node) return null;
  var ancestors = [];
  var cur = node.parent, guard = 0;
  while (cur && guard++ < 64) {
    var p = x.byCode.get(cur);
    if (!p) break;
    ancestors.unshift({ code: p.code, name: p.name });
    cur = p.parent;
  }
  var crit = (NV.files['diagnostics.json'].critical || {})[code] || null;
  return { ok: true, asset: { maker: node.maker, makersType: node.makers_type }, ancestors: ancestors, tm: crit };
}

// ndxBuild + ndxBuildTier3, synchronously: everything is on the phone already.
function nvDModel(code) {
  var L = nvDL(), x = nvDix(), D = NV.diag;
  var reg = x.byCode.get(code) || null;
  var hist = reg ? null : x.historic.filter(function (h) { return L.normCode(h.code) === L.normCode(code); })[0];
  var detail = reg ? nvDDetail(code) : null;
  var asset = detail ? detail.asset : null;
  var res = L.resolve(x.ix, code);
  var codes = L.codesSearched(code, res);
  var own = res.via === 'parent' ? null : res.note;
  var mirror = nvDRecord(codes, true);
  var jobs = [];
  mirror.forEach(function (r) { (r.jobs || []).forEach(function (j) { jobs.push(j); }); });
  jobs.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
  var m = {
    code: code,
    title: reg ? reg.name : (hist ? hist.name : (res.note ? res.note.name : '')),
    inRegister: !!reg,
    ancestors: detail ? detail.ancestors : [],
    maker: (asset && asset.maker) || (reg && reg.maker) || '',
    model: (asset && asset.makersType) || (reg && reg.makers_type) || '',
    critical: L.criticality(detail ? detail.tm : null),
    symptom: '', engineer: '',
    preparedAt: new Date(),
    res: res, codes: codes, mirror: mirror, jobs: jobs,
    beneath: L.notesBeneath(x.ix, code),
    candidates: L.rankCandidates(own),
    coverage: L.coverage(own, codes, mirror),
    sinceSync: L.jobsSinceSync(own, jobs),
    noteFile: null, recordFile: null,
    ownNote: own
  };
  m.service = L.serviceHistory(m.jobs, { note: own, critical: m.critical });
  if (D.tier === 3 || D.tier === 'all') nvDTier3(m);
  return m;
}

function nvDTier3(m) {
  var L = nvDL(), x = nvDix(), D = NV.diag;
  var rows = m.inRegister ? x.rows : x.rows.concat(x.historic.map(function (h) { return { code: h.code, name: h.name }; }));
  var p = L.population(rows, m.code);
  m.population = p;
  var ownNote = function (code) { var r = L.resolve(x.ix, code); return r.note && r.via !== 'parent' ? r.note : null; };
  var self = { code: m.code, name: m.title, self: true, flags: [] };
  var siblings = p.siblings.slice(), others = p.other.slice();
  var sameTitle = p.sameTitle.slice(0, NV_LIST_CAP), sameModel = p.sameModel.slice(0, NV_LIST_CAP);
  var listed = [self].concat(siblings, others, sameTitle, sameModel);
  var counts = nvDRecord(Array.from(new Set(listed.map(function (u) { return u.code; }))), false);
  var byNorm = new Map();
  counts.forEach(function (r) {
    var k = L.normCode(r.asked);
    var had = byNorm.get(k);
    if (!had) byNorm.set(k, { jobCount: r.jobCount, lastJob: r.lastJob });
    else { had.jobCount += r.jobCount; if (r.lastJob > (had.lastJob || '')) had.lastJob = r.lastJob; }
  });
  var dress = function (u) { return Object.assign({}, u, { note: ownNote(u.code), mirror: byNorm.get(L.normCode(u.code)) || null }); };
  m.selfUnit = dress(self);
  m.siblingUnits = siblings.map(dress);
  m.otherUnits = others.map(dress);
  m.sameTitleUnits = sameTitle.map(dress);
  m.sameModelUnits = sameModel.map(dress);
  m.grid = L.categoryGrid(x.ix, [m.selfUnit].concat(m.siblingUnits));
  var terms = L.sweepTerms(D.sweepQ);
  if (terms.length) {
    var lateralUnits = siblings.concat(others);
    var includedClass = p.sameTitle.length > 0;
    p.sameTitle.forEach(function (u) { if (!lateralUnits.some(function (y) { return y.code === u.code; })) lateralUnits.push(u); });
    var capped = '';
    if (lateralUnits.length > NV_SWEEP_CAP) {
      capped = 'Searched the first ' + NV_SWEEP_CAP + ' of ' + lateralUnits.length + ' units (axis 1 first); the rest were not read.';
      lateralUnits = lateralUnits.slice(0, NV_SWEEP_CAP);
    }
    var names = new Map(lateralUnits.map(function (u) { return [L.normCode(u.code), u.name]; }));
    var lat = nvDRecord(lateralUnits.map(function (u) { return u.code; }), true);
    var latJobs = [];
    lat.forEach(function (r) { (r.jobs || []).forEach(function (j) { latJobs.push(Object.assign(j, { unitName: names.get(L.normCode(r.asked)) || r.name })); }); });
    var selfJobs = m.jobs.map(function (j) { return Object.assign({}, j, { unitName: m.title }); });
    m.sweep = { terms: terms, includedClass: includedClass, unitsSearched: lateralUnits.length,
      lateral: L.sweep(latJobs, D.sweepQ).hits, self: L.sweep(selfJobs, D.sweepQ).hits, capped: capped };
  } else {
    m.sweep = { terms: [], lateral: [], self: [], unitsSearched: 0 };
  }
}

NV_VIEWS.diag = {
  title: function () { return 'Diagnostics'; },
  needs: ['diagnostics.json'],
  loadingText: 'Reading the failure history…',
  render: function (view, body) {
    var d = NV.files['diagnostics.json'];
    if (d.ok === false) { body.innerHTML = nvFileError('diagnostics.json'); return; }
    var x = nvDix(), L = nvDL(), D = NV.diag;
    var m = x.meta || {};
    body.innerHTML = '<div class="search"><input type="search" id="dg-q" autocomplete="off" spellcheck="false" placeholder="Search code or name…" value="' + nvEsc(D.q) + '"></div>' +
      '<div id="dg-ac"></div><div id="dg-home"><div class="count">' + (m.failureHistory || 0).toLocaleString() + ' failure histories · ' + (m.mirrorNotes || 0).toLocaleString() + ' job records</div>' +
      '<label class="check"><input type="checkbox" id="dg-only"' + (D.only ? ' checked' : '') + '> Only equipment with a failure history</label>' +
      '<div id="dg-tree"></div>' + nvDAboutHtml() + '</div>';
    var drawAc = function () {
      var ac = document.getElementById('dg-ac'), home = document.getElementById('dg-home');
      if (!D.q.trim()) { ac.innerHTML = ''; home.hidden = false; return; }
      home.hidden = true;
      var hits = L.searchUnits(x.units, D.q, 40);
      ac.innerHTML = hits.length ? hits.map(function (u) {
        var note = L.hasNote(x.ix, u.code);
        return '<button class="row" data-code="' + nvEsc(u.code) + '"' + (u.retired ? ' style="opacity:.6"' : '') + '><span class="row-id">' + nvEsc(u.code) + '</span><span class="row-main">' + nvHighlight(u.name, D.q) + '</span>' +
          (note ? '<span class="tag accent">history</span>' : '') + (u.historic ? '<span class="tag dash">old code</span>' : '') + '</button>';
      }).join('') : '<div class="empty">No component matches that.</div>';
    };
    nvDDrawTree();
    drawAc();
    body.oninput = function (e) {
      if (e.target.id === 'dg-q') { D.q = e.target.value; drawAc(); }
      else if (e.target.id === 'dg-only') { D.only = e.target.checked; nvDDrawTree(); }
    };
    body.onclick = function (e) {
      var tw = e.target.closest('[data-twisty]');
      if (tw) { var k = tw.dataset.twisty; D.expanded[k] = !D.expanded[k]; nvDDrawTree(); return; }
      var row = e.target.closest('[data-code]');
      if (row) nvDSelect(row.dataset.code);
    };
  }
};

function nvDSelect(code) {
  var x = nvDix(), D = NV.diag;
  // The symptom search carries across machines; the reason filter belongs to
  // the last machine's reports (ndxSelect).
  D.techFilter = '';
  // Opening a machine opens its branch in the tree too, for the way back.
  if (!x.byCode.has(code)) D.expanded[NV_HISTORIC] = true;
  var cur = x.byCode.get(code) && x.byCode.get(code).parent, guard = 0;
  while (cur && guard++ < 64) { D.expanded[cur] = true; cur = x.byCode.get(cur) && x.byCode.get(cur).parent; }
  if ((x.childrenOf.get(code) || []).length) D.expanded[code] = true;
  nvGo({ v: 'diagm', code: code });
}

function nvDShown(code) {
  var L = nvDL(), x = nvDix();
  if (!NV.diag.only) return true;
  return L.hasNote(x.ix, code) || L.hasNoteBeneath(x.ix, code);
}
function nvDMark(code) {
  var L = nvDL(), x = nvDix();
  if (L.hasNote(x.ix, code)) return '<span class="dot note" title="Has a failure-history note"></span>';
  if (L.hasNoteBeneath(x.ix, code)) return '<span class="dot under" title="Failure-history notes beneath"></span>';
  return '<span class="dot" style="border-color:transparent"></span>';
}
// Only expanded branches are built — collapsed, the register is a few dozen rows.
function nvDDrawTree() {
  var host = document.getElementById('dg-tree');
  if (!host) return;
  var x = nvDix(), L = nvDL(), D = NV.diag;
  var out = [];
  var row = function (code, name, depth, kids, cls) {
    var open = !!D.expanded[code];
    out.push('<div class="node ' + (cls || '') + '" data-code="' + nvEsc(code) + '" style="padding-left:' + (depth * 14) + 'px">' +
      (kids ? '<button class="twisty' + (open ? ' open' : '') + '" data-twisty="' + nvEsc(code) + '" aria-label="' + (open ? 'Collapse' : 'Expand') + '">▸</button>' : '<span class="twisty-sp"></span>') +
      nvDMark(code) + '<span class="node-code">' + nvEsc(code) + '</span><span class="node-name">' + nvEsc(name) + '</span></div>');
    return open;
  };
  var walk = function (code, depth) {
    var r = x.byCode.get(code);
    if (!r || !nvDShown(code)) return;
    var kids = (x.childrenOf.get(code) || []).filter(nvDShown);
    if (row(code, r.name, depth, kids.length, r.retired ? 'retired' : '')) kids.forEach(function (k) { walk(k, depth + 1); });
  };
  x.roots.forEach(function (r) { walk(r, 0); });
  var hist = x.historic.filter(function (h) { return !D.only || L.hasNote(x.ix, h.code); });
  if (hist.length) {
    var open = !!D.expanded[NV_HISTORIC];
    out.push('<div class="node" data-twisty="' + NV_HISTORIC + '"><button class="twisty' + (open ? ' open' : '') + '" data-twisty="' + NV_HISTORIC + '">▸</button><span class="node-name">Not in the current register (' + hist.length + ')</span></div>');
    if (open) hist.forEach(function (h) { row(h.code, h.name, 1, 0, 'hist'); });
  }
  if (!out.length) out.push('<div class="empty">' + nvEsc(x.registerError || 'Nothing to show.') + '</div>');
  else if (x.registerError) out.unshift('<div class="empty">' + nvEsc(x.registerError) + ' Only codes with a record are listed.</div>');
  host.innerHTML = out.join('');
}

function nvDAboutHtml() {
  var L = nvDL();
  return '<div class="sec" style="margin-top:22px"><h3>What the tiers are</h3>' + ['tech', 1, 2, 3].map(function (t) {
    return '<div class="note-box"><b>' + nvEsc(L.TIERS[t].name) + '</b><br>' + nvEsc(L.TIERS[t].scope) + '</div>';
  }).join('') +
  '<div class="note-box"><b>Nothing here tells you what is wrong.</b> Every word of substance is recited from a note somebody wrote, and every number is a count. ' +
  'The judgement of Tier 3 and Tier 4 is the Maintenance seat\'s, in the Roundtable. A ● in the tree marks a machine with a failure-history note; ○ a group with notes beneath it.</div></div>';
}

NV_VIEWS.diagm = {
  title: function (view) { return view.code; },
  needs: ['diagnostics.json', 'diagnostics-jobs.json', 'letterhead.json'],
  loadingText: 'Reading the record…',
  render: function (view, body) {
    var D = NV.diag, x = nvDix();
    var m = nvDModel(view.code);
    nvSetBar(view.code, m.title);
    var sweepOn = D.tier === 3 || D.tier === 'all' || D.tier === 'tech';
    var tech = D.tier === 'tech';
    var chips = '';
    if (tech && m.service && m.service.count) {
      var chip = function (val, label, n) { return '<button class="chip-btn' + (D.techFilter === val ? ' on' : '') + '" data-techf="' + nvEsc(val) + '">' + nvEsc(label) + '<span>' + n + '</span></button>'; };
      var parts = [chip('', 'All', m.service.count)];
      m.service.groups.forEach(function (g) {
        parts.push(chip(g.group, g.group, g.count));
        if (g.reasons.length > 1 || g.reasons[0].reason !== g.group) g.reasons.forEach(function (r) { parts.push(chip(r.reason, r.reason, r.count)); });
      });
      chips = '<div class="chips">' + parts.join('') + '</div>';
    }
    body.innerHTML = '<div class="head"><div class="title"><span class="tid">' + nvEsc(view.code) + '</span>' + nvEsc(m.title) + '</div>' +
      (m.ancestors.length ? '<div class="meta">' + m.ancestors.map(function (a) { return nvEsc(a.code); }).join(' › ') + '</div>' : '') + '</div>' +
      '<div class="seg" role="tablist">' + NV_TIER_TABS.map(function (t) { return '<button data-tier="' + t[0] + '" class="' + (D.tier === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>' +
      (sweepOn ? '<div class="field-lbl">' + (tech ? 'Search the reports' : 'Search the record (Tier 3)') + '</div><div class="field-row"><input type="search" id="dg-sweep" value="' + nvEsc(D.sweepQ) +
        '" placeholder="won\'t start, tripped, no power"><button id="dg-sweep-go">Search</button></div>' : '') +
      chips + '<div id="dg-paper"></div>';
    var model = Object.assign({}, m, { techFilter: D.techFilter, techQuery: D.sweepQ });
    var lh = nvLetterhead();
    var tiers = D.tier === 'all' ? [1, 2, 3] : [D.tier];
    nvPaper(document.getElementById('dg-paper'), nvDR().buildDocument(model, { tiers: tiers, setup: lh.setup, vessel: lh.vessel, printedAt: new Date(), interactive: true }),
      function (d) { if (d.code) nvDSelect(d.code); });
    var sweep = function () { var i = document.getElementById('dg-sweep'); if (i) D.sweepQ = i.value; nvRender(); };
    body.oninput = null;
    body.onclick = function (e) {
      var t = e.target.closest('[data-tier]');
      if (t) { var k = t.dataset.tier; D.tier = (k === 'all' || k === 'tech') ? k : Number(k); nvRender(); return; }
      var c = e.target.closest('[data-techf]');
      if (c) { D.techFilter = c.dataset.techf; nvRender(); return; }
      if (e.target.closest('#dg-sweep-go')) sweep();
    };
    var si = document.getElementById('dg-sweep');
    if (si) si.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); sweep(); } });
  }
};

nvInit();
</script>
