  try { await ntAppendEvent('note_archived', { note_id: id }); ntCloseDetail(); }
  catch (e) { ntToast('Could not save — ' + e.message); }
}

async function ntUnarchive(id) {
  try { await ntAppendEvent('note_unarchived', { note_id: id }); }
  catch (e) { ntToast('Could not save — ' + e.message); }
}

async function ntDelete(id) {
  var n = NT.notes[id];
  var extra = notesReduce.hasAttachments(n)
    ? '\n\nIts attachments stay recoverable for ' + notesReduce.RETENTION_DAYS.deleted + ' days, then become eligible for purge.'
    : '';
  if (!confirm('Delete this note? It disappears from every view (the event stream keeps a tombstone).' + extra)) return;
  try { await ntAppendEvent('note_deleted', { note_id: id }); ntCloseDetail(); }
  catch (e) { ntToast('Could not save — ' + e.message); }
}

function ntPickPhoto() {
  var inp = document.getElementById('photo-input');
  inp.onchange = function () {
    NT.stagedPhoto = inp.files[0] || null;
    document.getElementById('photo-stage').innerHTML = NT.stagedPhoto
      ? ntEsc(NT.stagedPhoto.name) + ' <button onclick="NT.stagedPhoto=null;document.getElementById(\'photo-stage\').innerHTML=\'\'">✕</button>'
      : '';
    inp.value = '';
  };
  inp.click();
}

async function ntAddComment() {
  var n = NT.notes[NT.openNote];
  if (!n) return;
  var text = document.getElementById('cmt-text').value.trim();
  if (!text && !NT.stagedPhoto) return;
  var commentId = 'cmt-' + ntUuid();
  try {
    var attachments = [];
    if (NT.stagedPhoto) attachments.push(await ntUploadAny(commentId, NT.stagedPhoto));
    await ntAppendEvent('comment_added', {
      note_id: n.note_id, comment_id: commentId,
      text: text, attachments: attachments
    });
    NT.stagedPhoto = null;
  } catch (e) { ntToast('Could not save comment — ' + e.message); }
}

async function ntAddNoteFiles(id) {
  var inp = document.getElementById('file-input');
  inp.onchange = async function () {
    var files = Array.prototype.slice.call(inp.files);
    inp.value = '';
    if (!files.length) return;
    try {
      var n = NT.notes[id];
      var next = (n.attachments || []).slice();
      for (var i = 0; i < files.length; i++) next.push(await ntUploadAny(id, files[i]));
      await ntAppendEvent('note_edited', { note_id: id, patch: { attachments: next }, before: { attachments: n.attachments } });
    } catch (e) { ntToast('Upload failed — ' + e.message); }
  };
  inp.click();
}

// ── Upload ──────────────────────────────────────────────────

// Images follow the task/rounds-comment convention exactly (1080×1024 full +
// 240×180 thumb @ 0.85 JPEG under data/assets/pictures/{item_id}/), so the
// Console's existing thumbnail and lightbox helpers render them unchanged.
// Everything else is stored as-is under data/notes/files/{item_id}/.
async function ntUploadAny(itemId, file) {
  return ntIsImage(file) ? ntUploadImage(itemId, file) : ntUploadFile(itemId, file);
}

async function ntUploadImage(itemId, file) {
  var safeName  = ntSanitizeFilename(file.name, '.jpg');
  var fullBlob  = await ntResizeImage(file, 1080, 1024, 0.85);
  var thumbBlob = await ntResizeImage(file, 240, 180, 0.85);
  var basePath  = ONEDRIVE_BASE + '/data/assets/pictures/' + itemId + '/';
  await ntPutBlob(basePath + safeName, fullBlob, 'image/jpeg');
  await ntPutBlob(basePath + 'thumb-' + safeName, thumbBlob, 'image/jpeg');
  return {
    kind: 'image',
    filename: safeName,
    path: 'data/assets/pictures/' + itemId + '/' + safeName,
    thumbnail_path: 'data/assets/pictures/' + itemId + '/thumb-' + safeName,
    size: fullBlob.size
  };
}

async function ntUploadFile(itemId, file) {
  // Graph's simple upload tops out at 4 MB and a document cannot be resized
  // down the way a photo can, so oversized files are refused with a reason
  // rather than a raw 413.
  if (file.size > 4 * 1024 * 1024) {
    throw new Error('"' + file.name + '" is ' + Math.round(file.size / 1048576) + ' MB — 4 MB is the limit for documents');
  }
  var safeName = ntSanitizeFilename(file.name, '.bin');
  var path = 'data/notes/files/' + itemId + '/' + safeName;
  await ntPutBlob(ONEDRIVE_BASE + '/' + path, file, file.type || 'application/octet-stream');
  return {
    kind: 'file',
    filename: safeName,
    path: path,
    thumbnail_path: null,
    size: file.size,
    content_type: file.type || null
  };
}

async function ntPutBlob(path, blob, contentType) {
  var resp = await ntFetch(ntGraphUrl(path), {
    method: 'PUT', headers: { 'Content-Type': contentType || 'application/octet-stream' }, body: blob
  });
  if (!resp.ok) throw new Error('Upload → ' + resp.status);
}

function ntSanitizeFilename(name, fallbackExt) {
  var dot = name.lastIndexOf('.');
  var ext = dot > 0 ? name.slice(dot).toLowerCase().replace(/[^a-z0-9.]/g, '') : (fallbackExt || '');
  var base = name.slice(0, dot > 0 ? dot : name.length)
    .replace(/[^a-zA-Z0-9\-]/g, '-').replace(/-+/g, '-').toLowerCase();
  return (base || 'file') + ext;
}

function ntResizeImage(file, maxW, maxH, quality) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var r = Math.min(maxW / w, maxH / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(function (b) { b ? resolve(b) : reject(new Error('Canvas toBlob failed')); }, 'image/jpeg', quality || 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
    img.src = url;
  });
}

// ── Misc ────────────────────────────────────────────────────

function ntShow(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function ntToggleArchived() {
  NT.showArchived = !NT.showArchived;
  document.getElementById('btn-archived').textContent = NT.showArchived ? 'Hide archived' : 'Show archived';
  ntRenderList();
}

function ntToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.style.display = 'none'; }, 4200);
}

ntInit();
</script>
